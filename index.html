<style>
/* Concepto: la puerta de la nevera de un piso compartido.
   Fondo blanco-nevera frío, listas sueltas sin tarjetas, un color de imán por compañero
   y el código del piso como letras magnéticas (el único elemento llamativo). */
:root{
  /* paleta del logo: azul cielo, azul marino y verde salvia */
  --bg:#EEF6FC;
  --paper:#FFFFFF;
  --ink:#1B2F4B;
  --primary:#2F4F79;
  --primary-on:#FFFFFF;
  --ok:#5B9A81;
  --muted:#52647C;
  --line:#C9DCEC;
  --bad:#B3261E;
  --focus:#2F4F79;
  --alert-bg:#FFF0CF; --alert-ink:#5A3B00;
  /* imanes: uno por compañero, afinados para convivir con el azul y el salvia */
  --m1:#D8644C; --m1t:#FFFFFF;
  --m2:#EDB84A; --m2t:#1B2F4B;
  --m3:#4E9A82; --m3t:#FFFFFF;
  --m4:#6B79CC; --m4t:#FFFFFF;
  --m5:#C45B8A; --m5t:#FFFFFF;
  --m6:#3C8DB4; --m6t:#FFFFFF;
  --font:'Archivo','Arial Narrow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A2A; --paper:#15253A; --ink:#E6EEF8; --primary:#9CC3EE; --primary-on:#0E1A2A; --ok:#7BBFA3; --muted:#9DB0C6; --line:#27405C; --bad:#FF8E85; --focus:#9CC3EE;
    --alert-bg:#3A2F14; --alert-ink:#F5D48A;
    --m2t:#1B2F4B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A2A; --paper:#15253A; --ink:#E6EEF8; --primary:#9CC3EE; --primary-on:#0E1A2A; --ok:#7BBFA3; --muted:#9DB0C6; --line:#27405C; --bad:#FF8E85; --focus:#9CC3EE;
  --alert-bg:#3A2F14; --alert-ink:#F5D48A;
  --m2t:#1B2F4B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; min-height:100vh;
}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
h1,h2{margin:0;text-wrap:balance}
h1{font-weight:850;font-stretch:118%;font-size:36px;line-height:1.02;letter-spacing:-.02em;overflow-wrap:anywhere}
h2{font-weight:750;font-stretch:108%;font-size:20px;line-height:1.15;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

/* iconos de color de compañero */
.m1{--c:var(--m1);--ct:var(--m1t)} .m2{--c:var(--m2);--ct:var(--m2t)} .m3{--c:var(--m3);--ct:var(--m3t)}
.m4{--c:var(--m4);--ct:var(--m4t)} .m5{--c:var(--m5);--ct:var(--m5t)} .m6{--c:var(--m6);--ct:var(--m6t)}
.mag{background:var(--c);color:var(--ct)}

/* cabecera */
.top{padding:calc(14px + env(safe-area-inset-top,0px)) 0 20px}
.logo{display:block;width:72px;height:auto}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;font-size:14px;font-weight:600}
.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:500}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status.demo i{background:var(--m2)}

/* secciones sin tarjetas */
.sec{padding:22px 0 8px;border-top:2px solid var(--primary)}
.sec+.sec{margin-top:18px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.count{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sub{margin:4px 0 12px;color:var(--muted);font-size:15px;max-width:44ch}

/* formularios */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;display:grid;gap:12px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{min-width:0}
.row>label,.row>input{flex:1}
label{display:grid;gap:5px;font-size:14px;font-weight:600}
input,select{width:100%;min-height:48px;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input::placeholder{color:var(--muted);opacity:.9}
.btn{min-height:48px;padding:10px 18px;border-radius:9px;border:1.5px solid var(--primary);background:var(--primary);color:var(--primary-on);font-weight:700;flex:none}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:40px;padding:6px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:wait}
.link{background:none;border:0;padding:6px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:var(--primary)}

/* letras de nevera */
.tiles{display:flex;gap:7px;margin:4px 0 10px}
.tile{flex:1;max-width:58px;aspect-ratio:3/4;display:grid;place-items:center;border-radius:7px;
  font-weight:900;font-stretch:125%;font-size:30px;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.28)}
.tile:nth-child(odd){transform:rotate(-2.5deg)}
.tile:nth-child(even){transform:rotate(2deg) translateY(2px)}

/* listas */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);min-height:60px}
.list li:first-child{border-top:0}
.list.receipt li{border-top:1.5px dashed var(--line);align-items:flex-start}
.list.receipt li:first-child{border-top:0}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.name{font-weight:700;font-size:17px}
.small{font-size:14px}
.dim{color:var(--muted)}
.done{text-decoration:line-through;color:var(--muted)}
.mag-dot{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:850;font-stretch:115%;font-size:19px}
.meta-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.meta-line .chip{margin-top:0}
.state{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.state.ok{background:var(--ok);color:#fff;border-color:transparent}
.chip{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}
.you{font-size:13px;font-weight:700;border:1.5px solid var(--primary);color:var(--primary);border-radius:99px;padding:1px 9px}
.check{flex:none;width:32px;height:32px;border-radius:8px;border:2px solid var(--primary);background:transparent;display:grid;place-items:center;color:transparent}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.check:disabled{border-color:var(--line);cursor:not-allowed}
.check:disabled[aria-pressed="true"]{background:var(--line);color:var(--muted)}
.x{flex:none;width:40px;height:40px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.x:hover{color:var(--bad)}
.amount{font-weight:850;font-stretch:112%;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.due{font-size:13px;font-weight:700;white-space:nowrap}
.due.soon{color:var(--ink);background:var(--m2);color:var(--m2t);padding:2px 9px;border-radius:99px}
.due.late{color:var(--bad)}
.right{display:grid;justify-items:end;gap:5px}
.alert{display:block;width:100%;text-align:left;margin:16px 0 0;padding:12px 14px;border:1.5px solid var(--m2);border-radius:12px;background:var(--alert-bg);color:var(--alert-ink);font-size:15px;font-weight:500}
.alert b{display:block;font-weight:800;margin-bottom:2px}
.list.receipt li.urgent{background:var(--alert-bg);border-radius:12px;padding-left:12px;padding-right:12px;margin:4px -12px;border-top-color:transparent}
.list.receipt li.urgent+li{border-top-color:transparent}
#fBill .row{align-items:flex-start}
.err{color:var(--bad);font-size:13px;font-weight:600}
input.invalid,select.invalid{border-color:var(--bad)}
.empty{padding:16px 0;color:var(--muted);font-size:15px;display:block!important;min-height:0!important}

/* progreso de la semana: un tramo por zona, con el color de quien la limpia */
.seg{display:flex;gap:4px;margin:10px 0 6px}
.seg i{flex:1;height:10px;border-radius:3px;background:var(--line)}
.seg i.on{background:var(--c)}

/* menú inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{background:transparent;border:0;border-radius:99px;min-height:44px;font-weight:700;font-size:15px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--primary);color:var(--primary-on)}

.notice{border:2px solid var(--bad);border-radius:12px;padding:14px;margin:0 0 16px;font-size:15px}
.notice ol{margin:8px 0 0;padding-left:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:9;
  max-width:min(440px,calc(100vw - 32px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:15px;font-weight:600}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
.confirm{border:2px solid var(--bad);border-radius:12px;padding:12px;margin-top:10px}
</style>
</head>

/* ---------- capa de datos: Supabase real ---------- */
function remoteApi(sb, uid){
  const ok = ({data, error}) => { if (error) throw error; return data; };
  return {
    kind:'supabase', uid,
    async myName(){ const r = ok(await sb.from('profiles').select('full_name').eq('id', uid).maybeSingle()); return r?.full_name || ''; },
    async setName(name){ ok(await sb.from('profiles').update({full_name:name}).eq('id', uid)); },
    async apartment(){
      const rows = ok(await sb.from('apartment_members').select('apartment_id, apartments(id,name,invite_code)').eq('user_id', uid).limit(1));
      return rows[0]?.apartments || null;
    },
    async createApartment(name){ ok(await sb.rpc('create_apartment',{p_name:name})); },
    async joinApartment(code){ ok(await sb.rpc('join_apartment',{p_code:code})); },
    async members(aptId){
      const rows = ok(await sb.from('apartment_members').select('user_id, created_at, profiles(full_name)').eq('apartment_id', aptId).order('created_at'));
      return rows.map(r => ({id:r.user_id, name:r.profiles?.full_name || 'Sin nombre'}));
    },
    async leave(aptId){ ok(await sb.from('apartment_members').delete().eq('apartment_id', aptId).eq('user_id', uid)); },
    async myBalance(aptId){
      const r = ok(await sb.from('apartment_balances').select('balance').eq('apartment_id', aptId).eq('user_id', uid).maybeSingle());
      return Number(r?.balance ?? 0);
    },
    async items(aptId){ return ok(await sb.from('shopping_items').select('id,name,is_bought,created_at').eq('apartment_id', aptId).order('is_bought').order('created_at')); },
    async addItem(aptId,name){ ok(await sb.from('shopping_items').insert({apartment_id:aptId,name})); },
    async setBought(id,v){ ok(await sb.from('shopping_items').update({is_bought:v}).eq('id', id)); },
    async delItem(id){ ok(await sb.from('shopping_items').delete().eq('id', id)); },
    async renameItem(id,name){ ok(await sb.from('shopping_items').update({name}).eq('id', id)); },
    async zones(aptId){ return ok(await sb.from('cleaning_zones').select('id,name').eq('apartment_id', aptId).order('created_at')); },
    async addZone(aptId,name){ ok(await sb.from('cleaning_zones').insert({apartment_id:aptId,name})); },
    async delZone(id){ ok(await sb.from('cleaning_zones').delete().eq('id', id)); },
    async assignments(aptId, week){
      ok(await sb.rpc('ensure_week_assignments',{p_apartment_id:aptId,p_week_start:week}));
      const rows = ok(await sb.from('cleaning_assignments').select('id,user_id,is_done,done_at,cleaning_zones(name),profiles(full_name)').eq('apartment_id', aptId).eq('week_start', week));
      return rows.map(r => ({id:r.id,user_id:r.user_id,is_done:r.is_done,done_at:r.done_at,zone:r.cleaning_zones?.name || '—',name:r.profiles?.full_name || 'Sin nombre'})).sort((a,b)=>a.zone.localeCompare(b.zone,'es'));
    },
    async setDone(id,v){
      const rows = ok(await sb.from('cleaning_assignments').update({is_done:v}).eq('id', id).select('id'));
      if (!rows.length) throw new Error('Solo puedes marcar tus propias tareas.');
    },
    async bills(aptId){ return ok(await sb.from('recurring_bills').select('id,name,amount,frequency,next_due_date,paid_by,is_paused').eq('apartment_id', aptId).eq('is_paused', false).order('next_due_date').order('name')); },
    async addBill(aptId,b){ ok(await sb.from('recurring_bills').insert({apartment_id:aptId,...b})); }
  };
}

    addZone:(a,name)=>{ if (db.zones.some(z=>z.name.toLowerCase()===name.toLowerCase())) return Promise.reject({code:'23505',message:'dup'}); db.zones.push({id:id('z'),name}); return wait(); },
    delZone:i=>{ db.zones=db.zones.filter(x=>x.id!==i); return wait(); },
    assignments:(a,week)=>{
      const wk = Math.floor((new Date(week+'T00:00:00') - new Date('2000-01-03T00:00:00'))/(7*864e5));
      return wait(db.zones.map((z,i)=>{ const m = db.members[(i+wk)%db.members.length]; const k = z.id+week; return {id:k,user_id:m.id,is_done:!!db.done[k],done_at:db.done[k]||null,zone:z.name,name:m.name}; }));
    },
    setDone:(i,v)=>{ db.done[i]= v ? new Date().toISOString() : null; return wait(); },
    bills:()=>wait(db.bills.filter(b=>!b.is_paused).sort((a,b)=>a.next_due_date.localeCompare(b.next_due_date)||a.name.localeCompare(b.name,'es'))),
    addBill:(a,b)=>{ db.bills.push({id:id('b'),is_paused:false,...b}); return wait(); }
  };
}

/* ---------- estado y arranque ---------- */
const S = { api:null, tab:'piso', me:'', apt:null, members:[], busy:false, editItem:null, bills:[] };
const app = $('#app');

const memStore = {};
const safeStorage = {
  getItem(k){ try{ return localStorage.getItem(k); }catch{ return k in memStore ? memStore[k] : null; } },
  setItem(k,v){ try{ localStorage.setItem(k,v); }catch{ memStore[k] = v; } },
  removeItem(k){ try{ localStorage.removeItem(k); }catch{ delete memStore[k]; } }
};
const limite = (promesa, ms, msg) => Promise.race([
  Promise.resolve(promesa),
  new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))
]);

async function boot(forceDemo){
  app.innerHTML = '<div class="loading">Conectando con la base de datos…</div>';
  $('#nav').hidden = true;
  if (forceDemo){ S.api = demoApi(); return start(); }
  try{
    if (!window.supabase) throw new Error('No se pudo cargar la librería de Supabase. Comprueba tu conexión a internet.');
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { storage: safeStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    });
    let session = null;
    try{ session = (await limite(sb.auth.getSession(), 4000, 'tiempo'))?.data?.session || null; }catch{ session = null; }
    if (!session){
      const { data, error } = await limite(sb.auth.signInAnonymously(), 9000,
        'La base de datos no responde desde aquí.');
      if (error) throw error;
      session = data.session;
    }
    S.api = remoteApi(sb, session.user.id);
    await limite(S.api.myName(), 9000, 'La base de datos no responde desde aquí.');
    return start();
  }catch(e){ showConnectionError(e); }
}

function showConnectionError(e){
  const m = (e && e.message) || String(e);
  const anon = /anonymous/i.test(m);
  const suelto = location.protocol === 'file:' || location.protocol === 'blob:';
  app.innerHTML = `
    <header class="top"><div class="meta">${LOGO_IMG}</div><h1>No he podido conectar</h1></header>
    <div class="notice"><b>${esc(m)}</b>
      ${anon ? `<ol><li>Abre el panel de Supabase y entra en el proyecto <b>TodoenOrden</b>.</li><li>Ve a <b>Authentication → Sign In / Providers</b>.</li><li>Activa <b>Allow anonymous sign-ins</b> y guarda.</li><li>Vuelve aquí y pulsa Reintentar.</li></ol>`
        : suelto ? `<p style="margin:8px 0 0">Has abierto el archivo guardado en el móvil. Desde ahí el navegador bloquea la conexión con la base de datos. Publica la app y ábrela por su enlace (https://…), o mírala aquí mismo con datos de ejemplo.</p>`
        : '<p style="margin:8px 0 0">Comprueba tu conexión a internet y vuelve a intentarlo.</p>'}
    </div>
    <div class="stack">
      <button class="btn" id="retry">Reintentar</button>
      <button class="btn ghost" id="demo">Ver con datos de ejemplo (sin base de datos)</button>
    </div>`;
  $('#retry').onclick = () => boot(false);
  $('#demo').onclick = () => boot(true);
}

async function start(){
  S.me = await S.api.myName();
  await refreshApt();
  render();
}
async function refreshApt(){
  S.apt = await S.api.apartment();
  S.members = S.apt ? await S.api.members(S.apt.id) : [];
}

/* ---------- vistas ---------- */
function header(title){
  const demo = S.api.kind === 'demo';
  return `<header class="top"><div class="meta">${LOGO_IMG}
    <span class="status ${demo?'demo':''}"><i></i>${demo?'Datos de ejemplo':'Conectado'}</span></div>
    <h1>${esc(title)}</h1>${bannerHtml()}</header>`;
}
function dueWords(d){
  if (d < 0) return `venció hace ${-d} ${-d===1?'día':'días'}`;
  if (d === 0) return 'vence hoy';
  if (d === 1) return 'vence mañana';
  return `vence en ${d} días`;
}
function bannerHtml(){
  if (S.tab === 'facturas') return '';
  const urgent = (S.bills || []).filter(b => daysUntil(b.next_due_date) < 3);
  if (!urgent.length) return '';
  const lines = urgent.slice(0,3).map(b => `${esc(b.name)} ${dueWords(daysUntil(b.next_due_date))}`).join('. ');
  return `<button class="alert" data-go="facturas"><b>${urgent.length===1?'Una factura vence pronto':urgent.length+' facturas vencen pronto'}</b>${lines}.</button>`;
}
app.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (!g) return;
  S.tab = g.dataset.go; S.editItem = null; render(); window.scrollTo(0,0);
});
function renderNav(){
  $('#navIn').innerHTML = TABS.map(([k,l]) => `<button data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${l}</button>`).join('');
  $('#navIn').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.editItem = null; render(); window.scrollTo(0,0); });
}
async function render(){
  if (!S.apt){ S.bills = []; $('#nav').hidden = true; return renderOnboarding(); }
  $('#nav').hidden = false; renderNav();
  try{
    if (S.tab !== 'facturas'){ try{ S.bills = await S.api.bills(S.apt.id); }catch{ S.bills = []; } }
    if (S.tab==='piso') renderPiso();
    else if (S.tab==='compra') await renderCompra();
    else if (S.tab==='limpieza') await renderLimpieza();
    else await renderFacturas();
  }catch(e){ toast(friendly(e)); }
}
async function run(e, fn){
  e.preventDefault();
  if (S.busy) return;
  S.busy = true;
  const btns = [...app.querySelectorAll('button')]; btns.forEach(b => b.disabled = true);
  try{ await fn(); }catch(err){ toast(friendly(err)); }
  finally{ S.busy = false; btns.forEach(b => { if (b.isConnected) b.disabled = false; }); }
}

/* Sin piso: nombre + crear o unirse (TEO-8) */
function renderOnboarding(){
  app.innerHTML = `${header('Tu piso, en orden')}
    <section class="sec">
      <h2>¿Cómo te llamas?</h2>
      <p class="sub">Es el nombre que verán tus compañeros.</p>
      <label>Tu nombre<input id="myName" maxlength="40" autocomplete="given-name" value="${esc(S.me)}" placeholder="Marta"></label>
    </section>
    <section class="sec">
      <h2>Crear un piso</h2>
      <p class="sub">Recibes un código de 6 letras para invitar a tus compañeros.</p>
      <form class="stack" id="fCreate">
        <label>Nombre del piso<input id="aptName" maxlength="60" placeholder="Piso de Lavapiés" required></label>
        <button class="btn" type="submit">Crear piso</button>
      </form>
    </section>
    <section class="sec">
      <h2>Unirme con un código</h2>
      <p class="sub">Pídele el código a quien ya haya creado el piso.</p>
      <form class="stack" id="fJoin">
        <label>Código<input id="code" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="K7P2QX" required style="text-transform:uppercase;letter-spacing:.2em;font-weight:800"></label>
        <button class="btn ghost" type="submit">Unirme al piso</button>
      </form>
    </section>`;
  const ensureName = async () => {
    const n = $('#myName').value.trim();
    if (!n){ toast('Escribe primero tu nombre.'); $('#myName').focus(); return false; }
    if (n !== S.me){ await S.api.setName(n); S.me = n; }
    return true;
  };
  $('#fCreate').onsubmit = e => run(e, async () => {
    if (!(await ensureName())) return;
    await S.api.createApartment($('#aptName').value.trim());
    await refreshApt(); S.tab='piso'; toast('Piso creado. Comparte el código con tus compañeros.'); render();
  });
  $('#fJoin').onsubmit = e => run(e, async () => {
    if (!(await ensureName())) return;
    await S.api.joinApartment($('#code').value.trim());
    await refreshApt(); S.tab='piso'; toast('Te has unido al piso.'); render();
  });
}

/* Piso: código, compañeros, cambiar nombre, salir (TEO-10, TEO-12) */
function renderPiso(){
  const apt = S.apt;
  const tiles = apt.invite_code.split('').map((c,i) => `<span class="tile mag m${(i%6)+1}">${esc(c)}</span>`).join('');
  app.innerHTML = `${header(apt.name)}
    <section class="sec">
      <h2>Código del piso</h2>
      <p class="sub">Compártelo con quien vaya a vivir aquí.</p>
      <div class="tiles" aria-label="Código ${esc(apt.invite_code.split('').join(' '))}">${tiles}</div>
      <button class="link" id="copyCode">Copiar código</button>
    </section>
    <section class="sec">
      <div class="sec-head"><h2>Compañeros</h2><span class="count">${S.members.length}</span></div>
      <ul class="list">${S.members.map(m => `
        <li><span class="mag-dot mag ${mc(m.id)}">${esc(initial(m.name))}</span>
          <span class="grow name">${esc(m.name)}</span>
          ${m.id===S.api.uid ? '<span class="you">Tú</span>' : ''}</li>`).join('')}</ul>
    </section>
    <section class="sec">
      <h2>Cambiar mi nombre</h2>
      <form class="row" id="fName" style="margin-top:10px">
        <input id="newName" maxlength="40" value="${esc(S.me)}" aria-label="Tu nombre" required>
        <button class="btn" type="submit">Guardar</button>
      </form>
    </section>
    <section class="sec">
      <h2>Salir del piso</h2>
      <p class="sub">Dejarás de ver sus datos. Podrás volver a entrar con el código.</p>
      <button class="btn danger" id="leave">Salir del piso</button>
      <div class="confirm" id="leaveConfirm" hidden>
        <p id="leaveMsg" style="margin:0 0 10px;font-size:15px">Comprobando tus cuentas…</p>
        <div class="row"><button class="btn danger small" id="leaveYes" hidden>Sí, salir</button><button class="btn ghost small" id="leaveNo">Cancelar</button></div>
      </div>
    </section>`;
  $('#copyCode').onclick = async () => {
    try{ await navigator.clipboard.writeText(apt.invite_code); toast('Código copiado.'); }
    catch{ toast('Copia el código a mano: ' + apt.invite_code); }
  };
  $('#fName').onsubmit = e => run(e, async () => {
    const n = $('#newName').value.trim(); if (!n) return;
    await S.api.setName(n); S.me = n; await refreshApt(); toast('Nombre actualizado.'); renderPiso();
  });
  $('#leave').onclick = async () => {
    $('#leaveConfirm').hidden = false; $('#leave').hidden = true;
    let bal = 0, known = true;
    try{ bal = await S.api.myBalance(apt.id); }catch{ known = false; }
    const m = $('#leaveMsg'); if (!m) return;
    if (!known){
      m.innerHTML = `<b>No he podido comprobar tus cuentas.</b> Puede que tengas saldos pendientes en “${esc(apt.name)}”. Al salir dejarás de ver sus datos.`;
    } else if (Math.abs(bal) >= 0.01){
      m.innerHTML = bal < 0
        ? `<b>Tienes cuentas pendientes.</b> Debes ${eur(-bal)} a tus compañeros. Si sales ahora, dejarás de ver los gastos del piso y esa deuda seguirá ahí.`
        : `<b>Tienes cuentas pendientes.</b> Tus compañeros te deben ${eur(bal)}. Si sales ahora, dejarás de ver los gastos del piso y puede que no lo recuperes.`;
    } else {
      m.innerHTML = `<b>Tus cuentas están saldadas.</b> Saldrás de “${esc(apt.name)}” y dejarás de ver sus datos.`;
    }
    const yes = $('#leaveYes'); if (yes) yes.hidden = false;
  };
  $('#leaveNo').onclick = () => { $('#leaveConfirm').hidden = true; $('#leave').hidden = false; };
  $('#leaveYes').onclick = async () => {
    try{ await S.api.leave(apt.id); await refreshApt(); toast('Has salido del piso.'); render(); }
    catch(err){ toast(friendly(err)); }
  };
}

/* Compra común (TEO-11) */
async function renderCompra(){
  const items = await S.api.items(S.apt.id);
  const pending = items.filter(i => !i.is_bought).length;
  app.innerHTML = `${header('Compra común')}
    <form class="row" id="fItem">
      <input id="itemName" maxlength="80" placeholder="Añadir producto: leche, pan…" aria-label="Producto" required>
      <button class="btn" type="submit">Añadir</button>
    </form>
    <section class="sec" style="margin-top:22px">
      <div class="sec-head"><h2>Lista de la compra</h2><span class="count">${pending} por comprar</span></div>
      <ul class="list">${items.length ? items.map(i => S.editItem === i.id ? `
        <li><form class="row grow" data-edit="${i.id}">
          <input id="editName" maxlength="80" value="${esc(i.name)}" aria-label="Nuevo nombre de ${esc(i.name)}" required>
          <button class="btn small" type="submit">Guardar</button>
          <button class="btn ghost small" type="button" id="cancelEdit">Cancelar</button></form></li>` : `
        <li><button class="check" aria-pressed="${i.is_bought}" data-b="${i.id}" aria-label="${i.is_bought?'Marcar como pendiente':'Marcar como comprado'}: ${esc(i.name)}">${CHECK}</button>
          <span class="grow name ${i.is_bought?'done':''}">${esc(i.name)}</span>
          <button class="x" data-e="${i.id}" aria-label="Editar ${esc(i.name)}">${PENCIL}</button>
          <button class="x" data-d="${i.id}" aria-label="Quitar ${esc(i.name)}">${CROSS}</button></li>`).join('')
        : '<li class="empty">Aún no hay nada en la lista. Añade lo primero que falte en casa.</li>'}</ul>
    </section>`;
  $('#fItem').onsubmit = e => run(e, async () => { await S.api.addItem(S.apt.id, $('#itemName').value.trim()); await renderCompra(); });
  app.querySelectorAll('[data-b]').forEach(b => b.onclick = async () => {
    try{ await S.api.setBought(b.dataset.b, b.getAttribute('aria-pressed') !== 'true'); await renderCompra(); }catch(err){ toast(friendly(err)); }
  });
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
    try{ await S.api.delItem(b.dataset.d); await renderCompra(); }catch(err){ toast(friendly(err)); }
  });
  app.querySelectorAll('[data-e]').forEach(b => b.onclick = async () => {
    S.editItem = b.dataset.e; await renderCompra(); const inp = $('#editName'); if (inp){ inp.focus(); inp.select(); }
  });
  const fe = app.querySelector('form[data-edit]');
  if (fe){
    fe.onsubmit = e => run(e, async () => { await S.api.renameItem(fe.dataset.edit, $('#editName').value.trim()); S.editItem = null; toast('Producto actualizado.'); await renderCompra(); });
    $('#cancelEdit').onclick = async () => { S.editItem = null; await renderCompra(); };
  }
}

/* Limpieza: zonas y marcar hecha (TEO-16, TEO-15) */
function doneLabel(when){
  if (!when) return 'Hecha';
  const d = new Date(when);
  if (isNaN(d)) return 'Hecha';
  return 'Hecha el ' + d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'});
}
async function renderLimpieza(){
  const week = iso(mondayOf());
  const [zones, asg] = await Promise.all([S.api.zones(S.apt.id), S.api.assignments(S.apt.id, week)]);
  const done = asg.filter(a => a.is_done).length;
  const end = new Date(mondayOf()); end.setDate(end.getDate()+6);
  const range = `${mondayOf().toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}`;
  app.innerHTML = `${header('Limpieza')}
    <section class="sec">
      <div class="sec-head"><h2>Esta semana</h2><span class="count">${done} de ${asg.length} hechas</span></div>
      <p class="sub">Semana del ${esc(range)}. Cada semana las zonas pasan al siguiente compañero.</p>
      ${asg.length ? `<div class="seg" aria-hidden="true">${asg.map(a => `<i class="${a.is_done?'on '+mc(a.user_id):''}"></i>`).join('')}</div>` : ''}
      <ul class="list">${asg.length ? asg.map(a => { const mine = a.user_id === S.api.uid; return `
        <li><button class="check" aria-pressed="${a.is_done}" data-a="${a.id}" ${mine?'':'disabled'} aria-label="${esc(a.zone)}: ${a.is_done?'hecha':'pendiente'}">${CHECK}</button>
          <span class="grow"><span class="name ${a.is_done?'done':''}">${esc(a.zone)}</span>
            <span class="meta-line"><span class="chip mag ${mc(a.user_id)}">${mine?'Te toca a ti':esc(a.name)}</span>
              <span class="state ${a.is_done?'ok':''}">${a.is_done ? esc(doneLabel(a.done_at)) : 'Pendiente'}</span></span></span></li>`; }).join('')
        : '<li class="empty">Define las zonas de la casa y aquí aparecerá quién limpia cada una.</li>'}</ul>
    </section>
    <section class="sec">
      <h2>Zonas de limpieza</h2>
      <p class="sub">Las zonas que hay que mantener limpias.</p>
      <form class="row" id="fZone"><input id="zoneName" maxlength="40" placeholder="Baño, cocina, salón…" aria-label="Nueva zona" required><button class="btn" type="submit">Añadir</button></form>
      <ul class="list" style="margin-top:6px">${zones.map(z => `
        <li><span class="grow name">${esc(z.name)}</span><button class="x" data-z="${z.id}" aria-label="Quitar ${esc(z.name)}">${CROSS}</button></li>`).join('')}</ul>
    </section>`;
  $('#fZone').onsubmit = e => run(e, async () => { await S.api.addZone(S.apt.id, $('#zoneName').value.trim()); await renderLimpieza(); });
  app.querySelectorAll('[data-z]').forEach(b => b.onclick = async () => {
    try{ await S.api.delZone(b.dataset.z); await renderLimpieza(); }catch(err){ toast(friendly(err)); }
  });
  app.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    try{ await S.api.setDone(b.dataset.a, b.getAttribute('aria-pressed') !== 'true'); await renderLimpieza(); }catch(err){ toast(friendly(err)); }
  });
}

/* Facturas periódicas: alta y listado por vencimiento (TEO-34, TEO-31) */
function clearFieldError(id){
  const el = $('#'+id), er = $('#e'+id.slice(1));
  if (er){ er.hidden = true; er.textContent = ''; }
  if (el){ el.classList.remove('invalid'); el.removeAttribute('aria-invalid'); }
}
async function renderFacturas(){
  const bills = await S.api.bills(S.apt.id); S.bills = bills;
  const who = id => S.members.find(m => m.id === id)?.name || 'Alguien';
  app.innerHTML = `${header('Facturas')}
    <section class="sec">
      <div class="sec-head"><h2>Próximos vencimientos</h2><span class="count">${bills.length}</span></div>
      <p class="sub">Ordenadas por la fecha en que vencen.</p>
      <ul class="list receipt">${bills.length ? bills.map(b => {
        const d = daysUntil(b.next_due_date);
        const urgent = d < 3;
        const label = d < 0 ? `Vencida hace ${-d} d` : d === 0 ? 'Vence hoy' : d === 1 ? 'Vence mañana' : d === 2 ? 'Vence en 2 días' : `En ${d} d`;
        const due = d < 0 ? `<span class="due late">${label}</span>` : urgent ? `<span class="due soon">${label}</span>` : `<span class="due dim">${label}</span>`;
        return `<li class="${urgent?'urgent':''}"><span class="grow"><span class="name">${esc(b.name)}</span><br>
            <span class="small dim">${esc(fmtDate(b.next_due_date))} · ${esc(FREQ[b.frequency])}</span><br>
            <span class="chip mag ${mc(b.paid_by)}">La adelanta ${esc(who(b.paid_by))}</span></span>
          <span class="right"><span class="amount">${eur(b.amount)}</span>${due}</span></li>`; }).join('')
        : '<li class="empty">Todavía no hay facturas. Da de alta la luz, el agua o el internet.</li>'}</ul>
    </section>
    <section class="sec">
      <h2>Nueva factura periódica</h2>
      <form class="panel" id="fBill" novalidate>
        <label>Nombre<input id="bName" maxlength="60" placeholder="Luz"><small class="err" id="eName" role="alert" hidden></small></label>
        <div class="row">
          <label>Importe (€)<input id="bAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="72,40"><small class="err" id="eAmount" role="alert" hidden></small></label>
          <label>Frecuencia<select id="bFreq">${Object.entries(FREQ).map(([k,v]) => `<option value="${k}" ${k==='monthly'?'selected':''}>${v}</option>`).join('')}</select></label>
        </div>
        <div class="row">
          <label>Fecha de vencimiento<input id="bDate" type="date"><small class="err" id="eDate" role="alert" hidden></small></label>
          <label>La adelanta<select id="bPaid">${S.members.map(m => `<option value="${m.id}" ${m.id===S.api.uid?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
        </div>
        <button class="btn" type="submit">Dar de alta</button>
      </form>
    </section>`;
  ['bName','bAmount','bDate'].forEach(id => $('#'+id).addEventListener('input', () => clearFieldError(id)));
  $('#fBill').onsubmit = e => run(e, async () => {
    ['bName','bAmount','bDate'].forEach(clearFieldError);
    let first = null;
    const fail = (id, msg) => { const el = $('#'+id), er = $('#e'+id.slice(1)); er.textContent = msg; er.hidden = false; el.classList.add('invalid'); el.setAttribute('aria-invalid','true'); first = first || el; };
    const name = $('#bName').value.trim();
    const amount = Number($('#bAmount').value);
    const date = $('#bDate').value;
    if (!name) fail('bName', 'Escribe el nombre de la factura.');
    if (!(amount > 0)) fail('bAmount', 'Indica un importe mayor que 0.');
    if (!date) fail('bDate', 'Indica la fecha de vencimiento.');
    if (first){ first.focus(); return; }
    await S.api.addBill(S.apt.id, {name, amount, frequency:$('#bFreq').value, next_due_date:date, paid_by:$('#bPaid').value});
    toast('Factura dada de alta.'); await renderFacturas();
  });
}
