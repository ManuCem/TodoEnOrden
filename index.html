<style>
/* Tablon de la nevera: cada seccion es una nota pegada con celo sobre papel cuadriculado.
   Cada apartado tiene su color y cada companero su iman. */
:root{
  --paper:#FFFFFF;
  --ink:#16243A;
  --muted:#5A6A80;
  --line:#D5E2EF;
  --bad:#B3261E;
  --focus:#2F4F79;
  --alert-bg:#FFF0CF; --alert-ink:#5A3B00;
  --board:#E7F1FA; --board-2:#F6FAFE; --grid:rgba(47,79,121,.07);
  --tape:rgba(240,214,140,.75); --tape-edge:rgba(198,166,74,.5);
  --shadow:0 2px 0 rgba(22,36,58,.06), 0 10px 24px -14px rgba(22,36,58,.45);
  --primary:#2F4F79; --primary-on:#FFFFFF; --ok:#5B9A81;
  --accent:#2F4F79; --accent-soft:#DDE9F6;
  --m1:#D8644C; --m1t:#FFF; --m2:#EDB84A; --m2t:#16243A; --m3:#4E9A82; --m3t:#FFF;
  --m4:#6B79CC; --m4t:#FFF; --m5:#C45B8A; --m5t:#FFF; --m6:#3C8DB4; --m6t:#FFF;
  --font:'Archivo','Arial Narrow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#17222F; --ink:#E7EFF8; --muted:#9BAFC6; --line:#2B3C4F; --bad:#FF8E85; --focus:#9CC3EE;
  --alert-bg:#3A2F14; --alert-ink:#F5D48A;
  --board:#0D161F; --board-2:#111C27; --grid:rgba(156,195,238,.07);
  --tape:rgba(196,168,96,.4); --tape-edge:rgba(120,100,50,.5);
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 12px 26px -14px rgba(0,0,0,.9);
  --primary:#9CC3EE; --primary-on:#0E1A2A; --ok:#7BBFA3;
  --accent:#9CC3EE; --accent-soft:#1E3047; --m2t:#16243A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#17222F; --ink:#E7EFF8; --muted:#9BAFC6; --line:#2B3C4F; --bad:#FF8E85; --focus:#9CC3EE;
  --alert-bg:#3A2F14; --alert-ink:#F5D48A;
  --board:#0D161F; --board-2:#111C27; --grid:rgba(156,195,238,.07);
  --tape:rgba(196,168,96,.4); --tape-edge:rgba(120,100,50,.5);
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 12px 26px -14px rgba(0,0,0,.9);
  --primary:#9CC3EE; --primary-on:#0E1A2A; --ok:#7BBFA3;
  --accent:#9CC3EE; --accent-soft:#1E3047; --m2t:#16243A; color-scheme:dark;
}
/* color propio de cada apartado */
body[data-tab="piso"]     { --accent:#2F4F79; --accent-soft:#DDE9F6 }
body[data-tab="compra"]   { --accent:#3F8F6B; --accent-soft:#DCEFE6 }
body[data-tab="limpieza"] { --accent:#3C8DB4; --accent-soft:#D9ECF6 }
body[data-tab="facturas"] { --accent:#B07B18; --accent-soft:#FBEED2 }
body[data-tab="normas"]   { --accent:#6B4FA0; --accent-soft:#ECE5F6 }
body[data-tab="avisos"]   { --accent:#B0455A; --accent-soft:#F8E1E6 }
body[data-tab="tablon"]   { --accent:#B0455A; --accent-soft:#F8E1E6 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body[data-tab="piso"]{--accent:#9CC3EE;--accent-soft:#1E3047}
  :root:not([data-theme="light"]) body[data-tab="compra"]{--accent:#7BC5A2;--accent-soft:#17302A}
  :root:not([data-theme="light"]) body[data-tab="limpieza"]{--accent:#7FC0DE;--accent-soft:#15303E}
  :root:not([data-theme="light"]) body[data-tab="facturas"]{--accent:#E9BC63;--accent-soft:#35290F}
  :root:not([data-theme="light"]) body[data-tab="normas"]{--accent:#C3A8EE;--accent-soft:#2A2140}
  :root:not([data-theme="light"]) body[data-tab="avisos"]{--accent:#F0A3B2;--accent-soft:#3A1B23}
  :root:not([data-theme="light"]) body[data-tab="tablon"]{--accent:#F0A3B2;--accent-soft:#3A1B23} }
:root[data-theme="dark"] body[data-tab="piso"]{--accent:#9CC3EE;--accent-soft:#1E3047}
:root[data-theme="dark"] body[data-tab="compra"]{--accent:#7BC5A2;--accent-soft:#17302A}
:root[data-theme="dark"] body[data-tab="limpieza"]{--accent:#7FC0DE;--accent-soft:#15303E}
:root[data-theme="dark"] body[data-tab="facturas"]{--accent:#E9BC63;--accent-soft:#35290F}
:root[data-theme="dark"] body[data-tab="normas"]{--accent:#C3A8EE;--accent-soft:#2A2140}
:root[data-theme="dark"] body[data-tab="avisos"]{--accent:#F0A3B2;--accent-soft:#3A1B23}
:root[data-theme="dark"] body[data-tab="tablon"]{--accent:#F0A3B2;--accent-soft:#3A1B23}

*{box-sizing:border-box}
html,body{margin:0}
body{
  color:var(--ink); font:16px/1.45 var(--font);
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/22px 22px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/22px 22px,
    radial-gradient(120% 80% at 50% 0%, var(--board-2), var(--board) 70%);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; min-height:100vh;
}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
h1,h2{margin:0;text-wrap:balance}
h1{font-weight:850;font-stretch:118%;font-size:33px;line-height:1.04;letter-spacing:-.02em;overflow-wrap:anywhere}
h2{font-weight:800;font-stretch:108%;font-size:19px;line-height:1.15;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}

.m1{--c:var(--m1);--ct:var(--m1t)} .m2{--c:var(--m2);--ct:var(--m2t)} .m3{--c:var(--m3);--ct:var(--m3t)}
.m4{--c:var(--m4);--ct:var(--m4t)} .m5{--c:var(--m5);--ct:var(--m5t)} .m6{--c:var(--m6);--ct:var(--m6t)}
.mag{background:var(--c);color:var(--ct)}

/* cabecera */
.top{padding:calc(14px + env(safe-area-inset-top,0px)) 0 16px}
.logo{display:block;width:72px;height:auto}
.logo-btn{display:block;padding:0;border:0;background:none;border-radius:12px;cursor:pointer;line-height:0}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:14px;font-weight:600}
.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;background:var(--paper);
  border:1px solid var(--line);border-radius:99px;padding:5px 12px;box-shadow:var(--shadow)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status.demo i{background:var(--m2)}
.top h1{padding-left:14px;border-left:6px solid var(--accent)}

/* cuenta de Google: avatar y menu */
.meta{position:relative}
.avatar{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);
  color:var(--ink);font-weight:800;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--shadow)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.chip.persona{display:inline-flex;align-items:center;gap:8px;padding:3px 13px 3px 3px;font-size:14px}
.chip.persona .cf{width:32px;height:32px;margin:0;vertical-align:baseline;flex:none}
.cfi{display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.3);font-weight:850}
.chip .cf{width:18px;height:18px;border-radius:50%;object-fit:cover;vertical-align:-4px;margin-right:6px}
.mag-dot{overflow:hidden}
.mag-dot img{width:100%;height:100%;object-fit:cover;display:block}
.mag-dot.sm{width:26px;height:26px;font-size:12px}
.mini-m{display:inline-flex;align-items:center;gap:6px;margin:5px 12px 0 0}
.avatar.big{width:56px;height:56px;font-size:22px;box-shadow:none}
.perfil-head{display:flex;align-items:center;gap:14px}
.menu{position:absolute;right:0;top:calc(100% - 4px);z-index:20;min-width:220px;background:var(--paper);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);padding:6px}
.menu .who{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who b{font-size:16px}
.menu .who small{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;font-weight:700}
.menu button:hover{background:var(--accent-soft)}

/* selector de pisos de ejemplo */
.pisos{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;margin:0 -2px;scrollbar-width:none}
.pisos::-webkit-scrollbar{display:none}
.pisos button{flex:none;background:var(--paper);border:1.5px solid var(--line);border-radius:99px;
  padding:8px 14px;font-size:14px;font-weight:700;color:var(--muted);box-shadow:var(--shadow);white-space:nowrap}
.pisos button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--primary-on)}
.pisos-label{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:6px}

/* notas pegadas al tablon */
.sec{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:4px 4px 14px 14px;
  padding:26px 16px 16px;margin:26px 0 0;box-shadow:var(--shadow)}
.sec::before{content:"";position:absolute;top:-11px;left:50%;width:92px;height:22px;transform:translateX(-50%) rotate(-1.6deg);
  background:var(--tape);border-left:1px dashed var(--tape-edge);border-right:1px dashed var(--tape-edge);border-radius:2px}
.sec:nth-of-type(even)::before{transform:translateX(-50%) rotate(1.4deg);left:46%}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{color:var(--accent)}
.count{font-size:13px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 10px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{margin:6px 0 12px;color:var(--muted);font-size:15px;max-width:44ch}

/* formularios */
.panel{background:var(--accent-soft);border-radius:12px;padding:14px;margin-top:14px;display:grid;gap:12px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{min-width:0}
.row>label,.row>input{flex:1}
label{display:grid;gap:5px;font-size:14px;font-weight:700}
textarea{width:100%;min-height:96px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;resize:vertical}
textarea:focus{outline:3px solid color-mix(in srgb, var(--accent) 35%, transparent);outline-offset:1px}
.list li.norma{display:block}
.sub-oculto{display:none!important}
.subtabs{margin:0 0 12px}
form.precio{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
form.precio input{width:110px;flex:0 0 110px}
.invitar summary{list-style:none;width:100%;display:flex;justify-content:center;align-items:center}
.invitar summary::-webkit-details-marker{display:none}
.invitar details[open] summary{margin-bottom:4px}
.mas-opciones summary{cursor:pointer;font-weight:800;color:var(--muted);min-height:44px;display:flex;align-items:center}
.saldo-yo{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.saldo-yo span{font-weight:800}.saldo-yo b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.saldo-yo small{grid-column:1/-1;color:var(--muted);font-size:14px}
.saldo-yo.pos b{color:#2E7D5B}.saldo-yo.neg b{color:var(--bad)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .saldo-yo.pos b, :root:not([data-theme="light"]) .mov.pago .tag-mov{color:#7BC5A2} }
:root[data-theme="dark"] .saldo-yo.pos b, :root[data-theme="dark"] .mov.pago .tag-mov{color:#7BC5A2}
.filtros{display:flex;gap:6px;overflow-x:auto;margin:14px 0 4px;padding-bottom:2px;scrollbar-width:none}
.filtro{flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;min-height:40px;padding:0 14px;font-weight:800;font-size:14px}
.filtro span{color:var(--muted);font-weight:700;margin-left:2px}
.filtro[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--primary-on)}
.filtro[aria-pressed="true"] span{color:inherit;opacity:.8}
.list li.mov{display:block}
.mov-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mov-top>span:first-child{min-width:0}
.tag-mov{display:inline-block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:99px;border:1.5px solid currentColor;margin-right:6px;vertical-align:2px;color:var(--muted)}
.mov.pago .tag-mov{color:#2E7D5B}.mov.factura .tag-mov{color:var(--accent)}
.seg{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.seg legend{font-weight:800;margin-bottom:6px;padding:0}
.seg-opt{position:relative;margin:0}
.seg-opt input{position:absolute;opacity:0;width:1px;height:1px}
.seg-opt span{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;font-size:14px;cursor:pointer}
.seg-opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--primary-on)}
.seg-opt input:focus-visible+span{outline:3px solid color-mix(in srgb, var(--accent) 45%, transparent);outline-offset:2px}
.parts{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
.parts legend{font-weight:800;padding:0 4px}
.part-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.part-row label{display:flex;align-items:center;gap:10px;font-weight:600;margin:0}
.part-row input[type=checkbox]{width:22px;height:22px;min-height:0}
.part-val{width:96px!important;flex:0 0 96px;text-align:right}
.list li.aviso{display:block;border-left:5px solid var(--accent);padding-left:12px}
.aviso .hasta{display:inline-block;margin-top:4px;font-size:13px;font-weight:800;color:var(--accent)}
.norma .desc{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.confirm{margin-top:10px;padding:12px;border:1.5px solid var(--bad);border-radius:10px;display:grid;gap:10px}
.confirm .row{display:flex;gap:10px;flex-wrap:wrap}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.list.act-log li{display:block}
.act-log details{margin-top:4px}
.act-log summary{cursor:pointer;font-weight:800;color:var(--accent);min-height:32px;display:flex;align-items:center}
.act-log dl{margin:6px 0 0;display:grid;gap:4px}
.act-log dt{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.act-log dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.tag-act{font-size:12px;font-weight:900;padding:1px 8px;border-radius:99px;border:1.5px solid currentColor;margin-right:6px}
.tag-act.created{color:#2E7D5B}.tag-act.updated{color:#B26A00}.tag-act.deleted{color:var(--bad)}
.counter{font-size:12px;color:var(--muted);justify-self:end}
input,select{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink)}
input::placeholder{color:var(--muted);opacity:.9}
.btn{min-height:48px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);
  color:var(--primary-on);font-weight:800;flex:none;box-shadow:0 2px 0 rgba(22,36,58,.12)}
.btn.ghost{background:var(--paper);color:var(--accent)}
.btn.danger{background:var(--paper);border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:40px;padding:6px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:wait}
.link{background:none;border:0;padding:6px 0;font-weight:800;text-decoration:underline;text-underline-offset:3px;color:var(--accent)}
#fBill .row{align-items:flex-start}
.err{color:var(--bad);font-size:13px;font-weight:700}
input.invalid,select.invalid{border-color:var(--bad)}

/* letras de nevera */
.tiles{display:flex;gap:7px;margin:10px 0;justify-content:center}
.tile{flex:1;max-width:56px;aspect-ratio:3/4;display:grid;place-items:center;border-radius:8px;
  font-weight:900;font-stretch:125%;font-size:30px;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.35)}

/* listas */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);min-height:60px}
.list li:first-child{border-top:0}
.list.receipt li{border-top:1.5px dashed var(--line);align-items:flex-start}
.list.receipt li:first-child{border-top:0}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.name{font-weight:800;font-size:17px}
.small{font-size:14px}
.dim{color:var(--muted)}
.done{text-decoration:line-through;color:var(--muted)}
.mag-dot{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:850;
  font-stretch:115%;font-size:19px;box-shadow:0 2px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.3)}
.meta-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.meta-line .chip{margin-top:0}
.state{font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.state.ok{background:var(--ok);color:#fff;border-color:transparent}
.chip{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:800}
.you{font-size:13px;font-weight:800;border:1.5px solid var(--accent);color:var(--accent);border-radius:99px;padding:1px 9px}
.check{flex:none;width:32px;height:32px;border-radius:9px;border:2px solid var(--accent);background:var(--paper);
  display:grid;place-items:center;color:transparent}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.check:disabled{border-color:var(--line);cursor:not-allowed}
.check:disabled[aria-pressed="true"]{background:var(--line);color:var(--muted)}
.x{flex:none;width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.x:hover{color:var(--bad);background:var(--accent-soft)}
.amount{font-weight:850;font-stretch:112%;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.due{font-size:13px;font-weight:800;white-space:nowrap}
.due.soon{background:var(--m2);color:var(--m2t);padding:2px 9px;border-radius:99px}
.due.late{color:var(--bad)}
.right{display:grid;justify-items:end;gap:5px}
.day{display:flex;align-items:center;gap:10px;margin:16px 0 2px;font-size:12px;font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.day::after{content:"";flex:1;height:1.5px;background:var(--accent-soft)}
.day:first-child{margin-top:6px}
.day .n{font-weight:800;color:var(--muted);letter-spacing:0}
.empty{padding:18px 0;color:var(--muted);font-size:15px;display:block!important;min-height:0!important;text-align:center}

/* tramos de la semana */
.seg{display:flex;gap:4px;margin:12px 0 6px}
.seg i{flex:1;height:12px;border-radius:4px;background:var(--line)}
.seg i.on{background:var(--c)}

/* menu inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.nav button{background:transparent;border:0;border-radius:99px;min-height:46px;font-weight:800;font-size:15px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--primary-on);box-shadow:0 2px 0 rgba(22,36,58,.15)}
.nav button[data-tab="facturas"]{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.05;padding:4px 2px}
.nav .eur{display:grid;place-items:center;flex:none;width:20px;height:20px;border-radius:50%;background:#B07B18;color:#fff;font-size:12px;font-weight:900;line-height:1;box-shadow:0 1px 0 rgba(22,36,58,.25)}
.nav button[aria-current="page"] .eur{background:#fff;color:#B07B18}
@media (max-width:420px){ .nav button{font-size:13.5px;padding:0 2px} }
@media (max-width:350px){ .nav button{font-size:12px} .nav .eur{width:18px;height:18px;font-size:11px} }

.notice{border:2px solid var(--bad);border-radius:12px;padding:14px;margin:0 0 16px;font-size:15px;background:var(--paper)}
.notice ol{margin:8px 0 0;padding-left:20px}
.alert{display:block;width:100%;text-align:left;margin:16px 0 0;padding:12px 14px;border:1.5px solid var(--m2);
  border-radius:12px;background:var(--alert-bg);color:var(--alert-ink);font-size:15px;font-weight:600;box-shadow:var(--shadow)}
.alert b{display:block;font-weight:900;margin-bottom:2px}
.turno{margin:16px 0 0;padding:14px;border:1.5px solid var(--m2);border-radius:12px;background:var(--alert-bg);color:var(--alert-ink);box-shadow:var(--shadow)}
.turno.ok{background:#E2F2E9;color:#14422B;border-color:#5B9A81}
.turno.vacio{background:var(--paper);color:var(--ink);border-color:var(--line)}
.turno-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.turno-top b{font-weight:900;font-size:17px}
.turno .badge{font-size:13px;font-weight:900;padding:2px 10px;border-radius:99px;background:var(--alert-ink);color:var(--alert-bg);white-space:nowrap}
.turno.ok .badge{background:#14422B;color:#E2F2E9}
.turno p{margin:6px 0 0;font-size:15px}
.turno ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.turno li{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px}
.turno li span{min-width:0}
.turno li strong{display:block;font-weight:900}
.turno .btn{min-height:40px;padding:6px 14px;font-size:15px;background:var(--alert-ink);border-color:var(--alert-ink);color:var(--alert-bg)}
.turno .plazo{font-weight:800}
.turno .link{color:inherit}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .turno.ok{background:#16302A;color:#BDEBD3;border-color:#4C8A70}
  :root:not([data-theme="light"]) .turno.ok .badge{background:#BDEBD3;color:#16302A} }
:root[data-theme="dark"] .turno.ok{background:#16302A;color:#BDEBD3;border-color:#4C8A70}
:root[data-theme="dark"] .turno.ok .badge{background:#BDEBD3;color:#16302A}
.state.late{border-color:var(--bad);color:var(--bad)}
li.paused>.grow,li.paused>.right{opacity:.55}
.acts{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.acts .link{min-height:40px;padding:0;font-weight:800}
.wk{margin:18px 0 2px;font-size:14px;font-weight:900;color:var(--accent)}
.cumple{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.list.receipt li.urgent{background:var(--alert-bg);border-radius:12px;padding-left:12px;padding-right:12px;margin:4px -12px;border-top-color:transparent}
.list.receipt li.urgent+li{border-top-color:transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom,0px));z-index:9;
  max-width:min(440px,calc(100vw - 32px));background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:12px;font-size:15px;font-weight:700}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
.confirm{border:2px solid var(--bad);border-radius:12px;padding:12px;margin-top:10px;background:var(--paper)}
/* ================= Animaciones ================= */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}}
@keyframes drop{from{opacity:0;transform:translateY(-28px) rotate(calc(var(--rot) - 28deg)) scale(.55)}}
@keyframes growY{from{transform:scaleY(0);opacity:0}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes ping{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(2.8);opacity:0}}
@keyframes glow{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:var(--shadow),0 0 0 5px color-mix(in srgb,var(--m2) 28%,transparent)}}
@keyframes menuIn{from{opacity:0;transform:translateY(-10px) scale(.9)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,18px) scale(.94)}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes ripple{from{transform:scale(0);opacity:.3}to{transform:scale(1);opacity:0}}

/* base: todo lo interactivo se mueve con un muelle suave */
.btn,.nav button,.pisos button,.status,.avatar,.chip,.state,.count,.you,.check,.x,.tile,.mag-dot,.logo,.link,.menu button,.alert,.turno,.sec{
  transition:transform .4s var(--spring),box-shadow .3s var(--out),background-color .25s,color .25s,border-color .25s,opacity .25s}
.btn,.nav button,.pisos button{position:relative;overflow:hidden;isolation:isolate}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:45%;transform:skewX(-20deg);pointer-events:none;
  background:linear-gradient(100deg,transparent,color-mix(in srgb,currentColor 24%,transparent),transparent);transition:left .7s var(--out)}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:0;transform:scale(0);animation:ripple .65s var(--out) forwards;z-index:-1}

/* indicador de conexion: pulso */
.status i{position:relative}
.status i::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 2.2s var(--out) infinite}
.alert{animation:glow 3s ease-in-out infinite}
.loading{animation:breathe 1.6s ease-in-out infinite}

/* listas: barrido de color al pasar el cursor */
.list li{background-image:linear-gradient(90deg,var(--accent-soft),transparent 85%);background-repeat:no-repeat;background-size:0% 100%;
  transition:background-size .5s var(--out)}
.list li.empty{background-image:none}

/* avisos y menus que aparecen */
.menu{transform-origin:top right;animation:menuIn .26s var(--spring)}
.menu button:hover{box-shadow:inset 3px 0 0 var(--accent);transform:translateX(3px)}
.confirm:not([hidden]){animation:rise .35s var(--spring)}
.toast:not([hidden]){animation:toastIn .4s var(--spring)}

/* letras de nevera: caen, se enderezan al tocarlas y arrastran a las vecinas */
.tile{--rot:-3deg;--ty:0px;transform:translateY(var(--ty)) rotate(var(--rot))}
.tile:nth-child(odd){--rot:-3deg;--ty:0px}
.tile:nth-child(even){--rot:2.2deg;--ty:3px}

/* pulsar: efecto de hundirse */
.btn:not(:disabled):active,.pisos button:active{transform:translateY(1px) scale(.97);box-shadow:0 0 0 rgba(0,0,0,0)}
.nav button:active{transform:scale(.93)}
.check:not(:disabled):active{transform:scale(.82)}
.avatar:active,.status:active{transform:scale(.92)}

@media (hover:hover){
  .btn:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 5px 0 rgba(22,36,58,.14),0 14px 22px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
  .btn.danger:not(:disabled):hover{box-shadow:0 5px 0 rgba(22,36,58,.1),0 14px 22px -12px color-mix(in srgb,var(--bad) 70%,transparent)}
  .btn:not(:disabled):hover::after{left:130%}
  .nav button:hover{transform:translateY(-3px)}
  .pisos button:hover{transform:translateY(-3px) scale(1.04)}
  .status:hover{transform:translateY(-2px);box-shadow:var(--shadow),0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  .avatar:hover{transform:scale(1.14) rotate(-5deg);box-shadow:var(--shadow),0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
  .logo:hover{transform:rotate(-7deg) scale(1.1)}
  .link:hover{transform:translateX(3px)}
  .chip:hover,.state:hover,.count:hover,.you:hover{transform:scale(1.1)}
  .check:not(:disabled):hover{transform:scale(1.15) rotate(-6deg)}
  .x:hover svg{transform:rotate(90deg) scale(1.12)}
  .x[data-e]:hover svg{transform:rotate(-14deg) scale(1.18)}
  .x svg{transition:transform .35s var(--spring)}
  .mag-dot:hover{transform:scale(1.12) rotate(-8deg)}
  .list li:not(.empty):hover{background-size:100% 100%}
  .list li:hover .mag-dot{transform:scale(1.08) rotate(-5deg)}
  .alert:hover,.turno:hover{transform:translateY(-3px)}
  .sec:hover{transform:translateY(-3px);box-shadow:0 2px 0 rgba(22,36,58,.06),0 22px 34px -18px rgba(22,36,58,.5)}
  .sec:hover::before{transform:translateX(-50%) rotate(-4deg) translateY(-3px)}
  .sec:nth-of-type(even):hover::before{transform:translateX(-50%) rotate(3.5deg) translateY(-3px)}
  .tile:hover{transform:translateY(calc(var(--ty) - 12px)) rotate(0deg) scale(1.16);z-index:1;
    box-shadow:0 12px 0 rgba(0,0,0,.14),0 20px 18px -8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35)}
  .tile:hover+.tile,.tile:has(+.tile:hover){transform:translateY(calc(var(--ty) - 5px)) rotate(var(--rot)) scale(1.05)}
}

/* al cambiar de pestaña: entrada escalonada (la clase .enter la pone un observador y se quita sola) */
.enter .top h1{animation:slideIn .55s var(--out) backwards}
.enter .logo{animation:pop .6s var(--spring) backwards}
.enter .sec,.enter .alert,.enter .turno{animation:rise .6s var(--out) backwards}
.enter .alert{animation:rise .6s var(--out) backwards}
.enter .sec:nth-of-type(2){animation-delay:.07s}.enter .sec:nth-of-type(3){animation-delay:.14s}
.enter .sec:nth-of-type(4){animation-delay:.21s}.enter .sec:nth-of-type(5){animation-delay:.28s}
.enter .sec:nth-of-type(6){animation-delay:.35s}.enter .sec:nth-of-type(n+7){animation-delay:.42s}
.enter .list li{animation:slideIn .5s var(--out) backwards}
.enter .list li:nth-child(2){animation-delay:.05s}.enter .list li:nth-child(3){animation-delay:.1s}
.enter .list li:nth-child(4){animation-delay:.15s}.enter .list li:nth-child(5){animation-delay:.2s}
.enter .list li:nth-child(6){animation-delay:.25s}.enter .list li:nth-child(n+7){animation-delay:.3s}
.enter .tiles .tile{animation:drop .75s var(--spring) backwards}
.enter .tile:nth-child(2){animation-delay:.07s}.enter .tile:nth-child(3){animation-delay:.14s}
.enter .tile:nth-child(4){animation-delay:.21s}.enter .tile:nth-child(5){animation-delay:.28s}
.enter .tile:nth-child(6){animation-delay:.35s}
.enter .seg i{transform-origin:bottom;animation:growY .55s var(--spring) backwards}
.enter .seg i:nth-child(2){animation-delay:.05s}.enter .seg i:nth-child(3){animation-delay:.1s}
.enter .seg i:nth-child(4){animation-delay:.15s}.enter .seg i:nth-child(5){animation-delay:.2s}
.enter .seg i:nth-child(n+6){animation-delay:.25s}
.enter .count{animation:pop .5s var(--spring) .25s backwards}
.enter .day::after{transform-origin:left;animation:growX .7s var(--out) backwards}
.nav button[aria-current="page"]{animation:pop .45s var(--spring)}

/* ===== Móvil: sin cursor, la respuesta llega al tocar. Solo transform/opacity (van por la GPU) y todo corto ===== */
html{-webkit-tap-highlight-color:transparent}
button,.link,.list li,.tile{touch-action:manipulation}
/* secciones que quedan fuera de pantalla: aparecen al hacer scroll */
.reveal{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .5s var(--out),transform .65s var(--spring)}
.reveal.in{opacity:1;transform:none}
/* por si la animación al hacer scroll no llega a dispararse: al poco se ve igualmente */
.reveal:not(.in){animation:revealFallback .4s 1.5s forwards}
@keyframes revealFallback{to{opacity:1;transform:none}}
.enter .sec.reveal{animation:none}
@media (hover:none){
  .alert{animation:none} /* el brillo con sombra obliga a repintar en cada fotograma: demasiado para un móvil */
  .tile:active{transform:translateY(calc(var(--ty) - 10px)) rotate(0deg) scale(1.14);transition-duration:.15s;z-index:1}
  .list li:not(.empty):active{background-size:100% 100%;transition-duration:.2s}
  .list li:active .mag-dot{transform:scale(1.1) rotate(-6deg)}
  .check:not(:disabled):active{transform:scale(.8) rotate(-8deg)}
  .x:active svg{transform:rotate(90deg) scale(1.15)}
  .x svg{transition:transform .3s var(--spring)}
  .chip:active,.state:active,.count:active,.you:active{transform:scale(1.12)}
  .link:active{transform:translateX(3px)}
  .logo-btn:active .logo{transform:rotate(-8deg) scale(1.1)}
  .menu button:active{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-soft)}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>

// siguiente (dir=1) o anterior (dir=-1) vencimiento según la frecuencia
function shiftDue(s, freq, dir = 1){
  const d = new Date(s + 'T00:00:00');
  if (freq === 'weekly') d.setDate(d.getDate() + 7*dir);
  else if (freq === 'bimonthly') d.setMonth(d.getMonth() + 2*dir);
  else if (freq === 'quarterly') d.setMonth(d.getMonth() + 3*dir);
  else if (freq === 'yearly') d.setFullYear(d.getFullYear() + dir);
  else d.setMonth(d.getMonth() + dir);
  return iso(d);
}

function daysUntil(s){ const [y,m,d] = s.split('-').map(Number); const t = new Date(y,m-1,d); const n = new Date(); return Math.round((t - new Date(n.getFullYear(),n.getMonth(),n.getDate()))/86400000); }

function remoteApi(sb, uid){
  const ok = ({data, error}) => { if (error) throw error; return data; };
  let hayOwner = true; // pasa a false si apartments.owner_id todavia no existe
  let hayFoto = true; // pasa a false si la columna profiles.avatar_url todavia no existe
  return {
    kind:'supabase', uid,
    async myName(){ const r = ok(await sb.from('profiles').select('full_name').eq('id', uid).maybeSingle()); return r?.full_name || ''; },
    async setName(name){ ok(await sb.from('profiles').update({full_name:name}).eq('id', uid)); },
    async myAvatar(){
      if (!hayFoto) return '';
      const r = await sb.from('profiles').select('avatar_url').eq('id', uid).maybeSingle();
      if (r.error){ hayFoto = false; return ''; }
      return r.data?.avatar_url || '';
    },
    async setAvatar(url){
      if (!hayFoto) throw new Error('Falta crear la columna avatar_url en la tabla profiles de Supabase.');
      const { error } = await sb.from('profiles').update({avatar_url:url}).eq('id', uid);
      if (error){ hayFoto = false; throw new Error('Falta crear la columna avatar_url en la tabla profiles de Supabase.'); }
    },
    async apartment(){
      const q = c => sb.from('apartment_members').select(`apartment_id, apartments(${c})`).eq('user_id', uid).limit(1);
      let r = await q(hayOwner ? 'id,name,invite_code,owner_id' : 'id,name,invite_code');
      if (r.error && hayOwner){ hayOwner = false; r = await q('id,name,invite_code'); }

  if (P.rico){
    const R = P.rico, U = i => uid(i), todos = P.miembros.map((_,i) => i), hace = (d, h = 0) => new Date(Date.now() - d*864e5 - h*36e5);

    db.bills.filter(b => !b.is_paused).forEach(b => {

    // limpieza: lo que ya se ha hecho esta semana
    const lunes = mondayOf().getTime() + 36e5;
    db.done = {};
    R.hechas.forEach(([zi, horas]) => { if (db.zones[zi]) db.done['z' + zi + w] = new Date(Math.max(lunes, Date.now() - horas*36e5)).toISOString(); });

  return {
    kind:'demo', uid:me, piso:pisoDemo,
    myName:()=>wait(db.myName), setName:n=>{ db.myName=n; db.members[0].name=n; return wait(); },
    apartment:()=>wait(db.apt), apartments:()=>wait(db.apt ? [db.apt] : []), createApartment:n=>{ db.apt={id:'apt-nuevo',name:n,invite_code:'M4R7TA'}; return wait(); },

    balances:()=>{
      const b = Object.fromEntries(db.members.map(m => [m.id, 0])); const add = (u, v) => { if (u in b) b[u] = Math.round((b[u] + v)*100)/100; };

      db.gastos.forEach(g => db.pagos.filter(p => p.bill_id === g.bill_id && p.due_date === g.date && p.user_id !== g.paid_by).forEach(p => {

      db.payments.forEach(p => { add(p.from_user, p.amount); add(p.to_user, -p.amount); });

    myBalance:()=>wait(P.saldo),
    items:()=>wait(db.items.slice().sort((a,b)=>a.is_bought-b.is_bought || b.created_at.localeCompare(a.created_at)).map(i => {

    addExpense:(a, g)=>{
      if (!(g.amount > 0)) return Promise.reject(new Error('El importe debe ser mayor que 0'));
      if (!g.participants || !g.participants.length) return Promise.reject(new Error('Tiene que haber al menos un participante'));

      else { shares = g.participants.map((u,i) => ({user_id:u, amount:Math.round(g.amount*g.values[i])/100}));

      if (k < 0) return Promise.reject(new Error('No se ha podido eliminar: puede que el aviso ya haya vencido o que no seas su autor.'));
      db.notices.splice(k,1); return wait(); },
    rules:()=>wait(db.rules.map(r => ({...r, created_by_name:nombreDe(r.created_by), updated_by_name:nombreDe(r.updated_by)}))),
    rulesLog:()=>wait(db.rulesLog.slice(0,30).map(l => ({...l}))),
    addRule:(a, x)=>{ const now = new Date().toISOString(); const r = {id:id('r'), title:x.title, description:x.description, created_by:me, created_at:now, updated_by:me, updated_at:now};
      db.rules.push(r); logRegla('created', r, me, now, null, {title:r.title, description:r.description}); return wait(); },

      const [r] = db.rules.splice(k,1); logRegla('deleted', r, me, new Date().toISOString(), {title:r.title, description:r.description}, null); return wait(); },
    generateDue:()=>{
      const hoy = iso(new Date()); let n = 0;
      db.bills.filter(b => !b.is_paused && db.members.some(m => m.id === b.paid_by)).forEach(b => {
        for (let k = 0; b.next_due_date <= hoy && k < 24; k++){
          if (!db.gastos.some(g => g.bill_id === b.id && g.date === b.next_due_date)){ crearGasto(b, b.next_due_date); n++; }

        }
      });
      return wait(n);

    advanceBill:(billId)=>{ const b = db.bills.find(x=>x.id===billId); const d = new Date(b.next_due_date+'T00:00:00');

      (saltos[b.frequency]||saltos.monthly)(); b.next_due_date = iso(d); return wait(); }
  };

  setItem(k,v){ try{ localStorage.setItem(k,v); }catch{ memStore[k] = v; } },
  removeItem(k){ try{ localStorage.removeItem(k); }catch{ delete memStore[k]; } }
};

{ const c = new URLSearchParams(location.search).get('codigo');

]);

  $('#nav').hidden = true;
  if (forceDemo){ S.api = demoApi(); return start(); }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { storage: safeStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    // Si la cuenta de Google ya existía, Supabase no puede enlazarla al usuario anónimo y vuelve con un error: entramos con ella.
    const q = new URLSearchParams(location.hash.replace(/^#/, '') + '&' + location.search.slice(1));
    if (/identity_already_exists|already linked/i.test((q.get('error_code') || '') + ' ' + (q.get('error_description') || ''))){
      history.replaceState(null, '', location.pathname);
      const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + location.pathname } });
      if (error) throw error;
      return;
    }
    let session = null;
    try{ session = (await limite(sb.auth.getSession(), 4000, 'tiempo'))?.data?.session || null; }catch{ session = null; }
    if (!session){
      const { data, error } = await limite(sb.auth.signInAnonymously(), 9000,
        'La base de datos no responde desde aquí.');
      if (error) throw error;
      session = data.session;
    }
    // Al enlazar Google, nombre y foto solo viven en las identidades del usuario, no en user_metadata.
    let user = session.user;
    try{ const r = await limite(sb.auth.getUser(), 4000, 'tiempo'); if (r?.data?.user) user = r.data.user; }catch{}
    const gId = (user.identities || []).find(i => i.provider === 'google')?.identity_data || {};
    const meta = user.user_metadata || {};
    S.sb = sb; S.anon = !!user.is_anonymous; S.email = user.email || gId.email || '';
    S.avatar = gId.avatar_url || gId.picture || meta.avatar_url || meta.picture || '';
    S.nombreG = gId.full_name || gId.name || meta.full_name || meta.name || S.email;
    S.api = remoteApi(sb, session.user.id);
    await limite(S.api.myName(), 9000, 'La base de datos no responde desde aquí.');
    return start();
  }catch(e){ showConnectionError(e); }
}

function showConnectionError(e){
  const m = (e && e.message) || String(e);
  const anon = /anonymous/i.test(m);
  const suelto = location.protocol === 'file:' || location.protocol === 'blob:';
  app.innerHTML = `
    <header class="top"><div class="meta">${LOGO_IMG}</div><h1>No he podido conectar</h1></header>
    <div class="notice"><b>${esc(m)}</b>
      ${anon ? `<ol><li>Abre el panel de Supabase y entra en el proyecto <b>TodoenOrden</b>.</li><li>Ve a <b>Authentication → Sign In / Providers</b>.</li><li>Activa <b>Allow anonymous sign-ins</b> y guarda.</li><li>Vuelve aquí y pulsa Reintentar.</li></ol>`
        : suelto ? `<p style="margin:8px 0 0">Has abierto el archivo guardado en el móvil. Desde ahí el navegador bloquea la conexión con la base de datos. Publica la app y ábrela por su enlace (https://…), o mírala aquí mismo con datos de ejemplo.</p>`
        : '<p style="margin:8px 0 0">Comprueba tu conexión a internet y vuelve a intentarlo.</p>'}

}

function reducirFoto(file, lado = 160){
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = lado;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, lado, lado);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('No he podido leer esa imagen.')); };
    img.src = url;
  });
}

    try{ await guardar(await reducirFoto(file)); }catch(err){ toast(friendly(err)); }
  };
}

/* Piso: código, compañeros, cambiar nombre, salir (TEO-10, TEO-12) */
/* Normas del piso: todos los compañeros tienen los mismos permisos.
   Quién y cuándo, y el registro de actividad, los guarda la base de datos (triggers). */
function cuandoNorma(t){
  const d = new Date(t); if (isNaN(d)) return '';
  return d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}) + ', ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}
/* Tablón de avisos: cualquiera del piso publica, solo el autor elimina, y los avisos
   con fecha de finalización desaparecen solos a esa hora (lo filtra la base de datos). */
function localNow(minutos = 0){
  const d = new Date(Date.now() + minutos*6e4); d.setSeconds(0,0);
  return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
}
/* Subpestañas dentro de cada sección, para no tener que bajar tanto */
const SUBS = {
  piso:     [['inicio','Inicio','#app .turno, #app .invitar'], ['comp','Compañeros','#comp'], ['ajustes','Ajustes','#ajustes']],
  compra:   [['pend','Por comprar','[data-g="pend"]'], ['hechos','Ya comprado','[data-g="hechos"]']],
  limpieza: [['semana','Esta semana','#semana'], ['zonas','Zonas','#zonas'], ['hist','Histórico','#hist']],
  facturas: [['saldos','Saldos','#saldos'], ['movs','Movimientos','#movs'], ['facts','Facturas','#facts']]
};
function subActual(tab){ S.sub = S.sub || {}; const k = S.sub[tab]; return SUBS[tab].some(o => o[0] === k) ? k : SUBS[tab][0][0]; }
function subtabsHtml(tab, counts = {}){
  const cur = subActual(tab);
  return `<div class="filtros subtabs" role="tablist" aria-label="Apartados">${SUBS[tab].map(([k,l]) =>
    `<button type="button" class="filtro" role="tab" data-subtab="${k}" aria-selected="${k === cur}" aria-pressed="${k === cur}">${l}${counts[k] != null ? ` <span>${counts[k]}</span>` : ''}</button>`).join('')}</div>`;
}
function aplicarSub(tab){
  const cur = subActual(tab);
  SUBS[tab].forEach(([k,,sel]) => app.querySelectorAll(sel).forEach(el => {
    el.classList.toggle('sub-oculto', k !== cur);
    if (k === cur) el.classList.remove('reveal', 'in');
  }));
  app.querySelectorAll('[data-subtab]').forEach(b => {
    const on = b.dataset.subtab === cur; b.setAttribute('aria-pressed', on); b.setAttribute('aria-selected', on);
    b.onclick = () => { S.sub[tab] = b.dataset.subtab; aplicarSub(tab); window.scrollTo({top:0}); };
  });
}

async function renderAvisos(){
  const apt = S.apt; let list, fallo = false;
  clearTimeout(S.avisoTimer);
  try{ list = await S.api.notices(apt.id); }catch(err){ fallo = friendly(err); }
  const host = document.getElementById('avisos'); if (!host || S.apt !== apt || S.tab !== 'tablon') return;
  if (fallo){ host.innerHTML = `<h2>Avisos</h2><p class="err" role="alert">No se han podido cargar los avisos: ${esc(fallo)}</p><button class="btn ghost small" id="aRetry">Reintentar</button>`; $('#aRetry').onclick = renderAvisos; return; }
  // por si alguno vence con la pantalla abierta
  const ahora = Date.now();
  list = list.filter(n => !n.expires_at || new Date(n.expires_at) > ahora);
  // Solo si algún aviso tiene fecha de finalización, y como mucho dentro de 24 h
  // (setTimeout no admite esperas de más de ~24 días: se dispararía al instante y en bucle).
  const conFecha = list.filter(n => n.expires_at).map(n => new Date(n.expires_at) - ahora).filter(ms => ms > 0);
  if (conFecha.length){
    const espera = Math.min(Math.min(...conFecha) + 1000, 864e5);
    S.avisoTimer = setTimeout(() => { if (S.tab === 'tablon' && document.getElementById('avisos') && S.apt === apt && !S.avisoForm && !S.avisoDel) renderAvisos(); }, espera);
  }
  const yo = S.api.uid;
  const form = S.avisoForm ? `
    <form id="fAviso" novalidate style="display:grid;gap:12px;margin-top:12px">
      <h3 class="wk" style="margin:0">Nuevo aviso</h3>
      <label>Título<input id="aTitle" maxlength="100" placeholder="Semana de exámenes del 9 al 13">
        <small class="err" id="eTitle" role="alert" hidden></small></label>
      <label>Contenido<textarea id="aBody" maxlength="1000" placeholder="Explica el aviso con claridad"></textarea>
        <span class="counter" id="aCount">0 / 1000</span><small class="err" id="eBody" role="alert" hidden></small></label>
      <label>Visible hasta (opcional)<input id="aExp" type="datetime-local" min="${localNow(1)}">
        <small class="small dim">Si lo dejas vacío, se verá hasta que lo elimines.</small>
        <small class="err" id="eExp" role="alert" hidden></small></label>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" type="submit">Publicar aviso</button>
        <button class="btn ghost" type="button" id="aCancel">Cancelar</button>
      </div>
    </form>` : `<button class="btn" id="aAdd" style="margin-top:12px">Publicar aviso</button>`;
  host.innerHTML = `
    <div class="sec-head"><h2>Avisos vigentes</h2><span class="count">${list.length}</span></div>
    <p class="sub">Lo que tienen que saber todos los del piso. Si le pones fecha de finalización, desaparece solo a esa hora.</p>
    ${form}
    ${list.length ? `<ul class="list" style="margin-top:14px">${list.map(n => `
      <li class="aviso"><span class="name">${esc(n.title)}</span>
        <p class="desc" style="margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.content)}</p>
        <span class="small dim">Publicado por ${esc(n.user_id === yo ? 'ti' : (n.author_name || 'un antiguo compañero'))} · ${esc(cuandoNorma(n.created_at))}</span><br>
        <span class="hasta">${n.expires_at ? 'Visible hasta el ' + esc(cuandoNorma(n.expires_at)) : 'Sin fecha de finalización'}</span>
        ${n.user_id !== yo ? '' : S.avisoDel === n.id ? `<div class="confirm" role="alertdialog" aria-label="Confirmar eliminación">
            <span>¿Seguro que quieres eliminar el aviso «${esc(n.title)}»? Desaparecerá para todos.</span>
            <span class="row"><button class="btn small danger" data-adel-ok="${esc(n.id)}">Sí, eliminar</button><button class="btn small ghost" data-adel-no>Cancelar</button></span></div>`
          : `<span class="acts"><button type="button" class="link" data-adel="${esc(n.id)}" aria-label="Eliminar el aviso ${esc(n.title)}">Eliminar</button></span>`}
      </li>`).join('')}</ul>`
      : '<p class="empty" style="margin-top:14px">No hay avisos vigentes en este piso.</p>'}
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="link" id="aRefresh">Actualizar</button></div>`;

  $('#aRefresh').onclick = async () => { await renderAvisos(); toast('Avisos actualizados.'); };
  const add = $('#aAdd'); if (add) add.onclick = () => { S.avisoForm = true; S.avisoDel = null; renderAvisos().then(() => $('#aTitle')?.focus()); };
  host.querySelectorAll('[data-adel]').forEach(b => b.onclick = () => { S.avisoDel = b.dataset.adel; renderAvisos(); });
  host.querySelectorAll('[data-adel-no]').forEach(b => b.onclick = () => { S.avisoDel = null; renderAvisos(); });
  host.querySelectorAll('[data-adel-ok]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try{ await S.api.delNotice(b.dataset.adelOk); toast('Aviso eliminado.'); }catch(err){ toast(friendly(err)); }
    S.avisoDel = null; await renderAvisos();
  });
  const f = $('#fAviso'); if (!f) return;
  $('#aBody').addEventListener('input', () => { $('#aCount').textContent = `${$('#aBody').value.length} / 1000`; clearFieldError('aBody'); });
  $('#aTitle').addEventListener('input', () => clearFieldError('aTitle'));
  $('#aExp').addEventListener('input', () => clearFieldError('aExp'));
  $('#aCancel').onclick = () => { S.avisoForm = false; renderAvisos(); };
  const fail = (idc, msg) => { const er = document.getElementById('e' + idc.slice(1)); er.textContent = msg; er.hidden = false; const el = document.getElementById(idc); el.setAttribute('aria-invalid','true'); return el; };
  f.onsubmit = async e => {
    e.preventDefault();
    const title = $('#aTitle').value.trim(), content = $('#aBody').value.trim(), exp = $('#aExp').value;
    let first = null; const mark = el => { if (!first) first = el; };
    if (!title) mark(fail('aTitle', 'Escribe el título del aviso.')); else if (title.length > 100) mark(fail('aTitle', 'El título no puede superar los 100 caracteres.'));
    if (!content) mark(fail('aBody', 'Escribe el contenido del aviso.')); else if (content.length > 1000) mark(fail('aBody', 'El contenido no puede superar los 1000 caracteres.'));
    let expires_at = null;
    if (exp){
      const d = new Date(exp);
      if (isNaN(d)) mark(fail('aExp', 'La fecha de finalización no es válida.'));
      else if (d.getTime() <= Date.now()) mark(fail('aExp', 'La fecha de finalización debe ser posterior a la fecha y hora actuales.'));
      else expires_at = d.toISOString();
    }
    if (first){ first.focus(); return; }
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    try{
      await S.api.addNotice(apt.id, {title, content, expires_at});
      S.avisoForm = false; toast('Aviso publicado. Lo verán todos los compañeros del piso.');
      await renderAvisos();
    }catch(err){
      btn.disabled = false;   // el formulario conserva lo escrito
      if (/EXPIRY_IN_PAST/.test(err?.message || '')) $('#aExp').focus(), fail('aExp', 'La fecha de finalización debe ser posterior a la fecha y hora actuales.');
      else toast(friendly(err));
    }
  };
}

async function renderNormas(){
  const box = document.getElementById('normas'); if (!box) return;
  const apt = S.apt;
  let rules, log, fallo = false;
  try{ [rules, log] = await Promise.all([S.api.rules(apt.id), S.api.rulesLog(apt.id)]); }catch(err){ fallo = friendly(err); }
  const host = document.getElementById('normas'); if (!host || S.apt !== apt || S.tab !== 'tablon') return;
  if (fallo){ host.innerHTML = `<h2>Normas del piso</h2><p class="err" role="alert">No se han podido cargar las normas: ${esc(fallo)}</p><button class="btn ghost small" id="normasRetry">Reintentar</button>`; $('#normasRetry').onclick = renderNormas; return; }
  const yo = S.api.uid;
  const quien = (idu, nombre) => idu && idu === yo ? 'ti' : (nombre || 'un antiguo compañero');
  const Quien = (idu, nombre) => idu && idu === yo ? 'Tú' : (nombre || 'Un antiguo compañero');
  if (S.normaForm && S.normaForm !== 'new' && !rules.some(r => r.id === S.normaForm)) S.normaForm = null;

      <label>Descripción<textarea id="nDesc" maxlength="1000" placeholder="De domingo a jueves, nada de ruido a partir de las 23:00." aria-describedby="eDesc nCount">${esc(edit ? edit.description : (S.normaDraft?.description || ''))}</textarea>

        <button class="btn ghost" type="button" id="nCancel">Cancelar</button>
      </div>
    </form>` : `<button class="btn" id="nAdd" style="margin-top:12px">Añadir norma</button>`;
  const verbo = {created:'añadió', updated:'modificó', deleted:'eliminó'};
  const etiqueta = {created:'Añadida', updated:'Modificada', deleted:'Eliminada'};
  const bloqueDatos = (t, d) => d ? `<dt>${t}</dt><dd><b>${esc(d.title || '')}</b>
${esc(d.description || '')}</dd>` : '';

    <div class="sec-head"><h2>Normas vigentes</h2><span class="count">${rules.length}</span></div>

        <p class="desc">${esc(r.description)}</p>
        <span class="small dim">Publicada por ${esc(quien(r.created_by, r.created_by_name))} · ${esc(cuandoNorma(r.created_at))}${
          r.updated_at && r.created_at && new Date(r.updated_at) - new Date(r.created_at) > 1000 ? `<br>Última modificación por ${esc(quien(r.updated_by, r.updated_by_name))} · ${esc(cuandoNorma(r.updated_at))}` : ''}</span>
        ${S.normaDel === r.id ? `<div class="confirm" role="alertdialog" aria-label="Confirmar eliminación">
            <span>¿Seguro que quieres eliminar la norma «${esc(r.title)}»? Seguirá apareciendo en la actividad.</span>
            <span class="row"><button class="btn small danger" data-ndel-ok="${esc(r.id)}">Sí, eliminar</button><button class="btn small ghost" data-ndel-no>Cancelar</button></span></div>`
          : `<span class="acts"><button type="button" class="link" data-nedit="${esc(r.id)}" aria-label="Editar la norma ${esc(r.title)}">Editar</button>
            <button type="button" class="link" data-ndel="${esc(r.id)}" aria-label="Eliminar la norma ${esc(r.title)}">Eliminar</button></span>`}
      </li>`).join('')}</ul>`
      : '<p class="empty">Todavía no se han establecido normas para este piso.</p>'}
    ${form}
    <div class="sec-head" style="margin-top:20px"><h3 class="wk" style="margin:0">Actividad reciente</h3><button class="link" id="nRefresh">Actualizar</button></div>
    ${log.length ? `<ul class="list act-log">${log.map(l => `
      <li><span class="tag-act ${esc(l.action)}">${etiqueta[l.action] || esc(l.action)}</span>
        <b>${esc(Quien(l.actor_id, l.actor_name))}</b> ${verbo[l.action] || ''} «${esc((l.new_data || l.old_data || {}).title || '')}»
        <br><span class="small dim">${esc(cuandoNorma(l.acted_at))}</span>
        <details><summary>Ver detalle</summary><dl>${l.action === 'updated' ? bloqueDatos('Antes', l.old_data) + bloqueDatos('Ahora', l.new_data)
          : l.action === 'deleted' ? bloqueDatos('Norma eliminada', l.old_data) : bloqueDatos('Norma añadida', l.new_data)}</dl></details></li>`).join('')}</ul>`
      : '<p class="empty">Todavía no hay actividad registrada.</p>'}`;

  $('#nRefresh').onclick = async () => { await renderNormas(); toast('Normas actualizadas.'); };
  const add = $('#nAdd'); if (add) add.onclick = () => { S.normaForm = 'new'; S.normaDel = null; renderNormas().then(() => $('#nTitle')?.focus()); };
  host.querySelectorAll('[data-nedit]').forEach(b => b.onclick = () => { S.normaForm = b.dataset.nedit; S.normaDel = null; renderNormas().then(() => { $('#fNorma')?.scrollIntoView({behavior:'smooth', block:'center'}); $('#nTitle')?.focus({preventScroll:true}); }); });
  host.querySelectorAll('[data-ndel]').forEach(b => b.onclick = () => { S.normaDel = b.dataset.ndel; renderNormas(); });

    b.disabled = true;
    try{ await S.api.delRule(b.dataset.ndelOk); S.normaDel = null; toast('Norma eliminada.'); }
    catch(err){ S.normaDel = null; toast(friendly(err)); }
    await renderNormas();
  });
  const f = $('#fNorma'); if (!f) return;
  const cuenta = () => { $('#nCount').textContent = `${$('#nDesc').value.length} / 1000`; };
  cuenta(); $('#nDesc').addEventListener('input', () => { cuenta(); clearFieldError('nDesc'); });
  $('#nTitle').addEventListener('input', () => clearFieldError('nTitle'));
  $('#nCancel').onclick = () => { S.normaForm = null; S.normaDraft = null; renderNormas(); };
  f.onsubmit = async e => {
    e.preventDefault();
    const title = $('#nTitle').value.trim(), description = $('#nDesc').value.trim();
    let first = null;
    const fail = (idc, msg) => { const er = document.getElementById('e' + idc.slice(1)); er.textContent = msg; er.hidden = false; const el = document.getElementById(idc); el.setAttribute('aria-invalid','true'); if (!first) first = el; };
    if (!title) fail('nTitle', 'Escribe un título para la norma.'); else if (title.length > 100) fail('nTitle', 'El título puede tener como máximo 100 caracteres.');
    if (!description) fail('nDesc', 'Escribe en qué consiste la norma.'); else if (description.length > 1000) fail('nDesc', 'La descripción puede tener como máximo 1000 caracteres.');
    if (first){ first.focus(); return; }
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    try{
      if (edit){ await S.api.updateRule(edit.id, {title, description}); toast('Norma modificada correctamente.'); }
      else { await S.api.addRule(apt.id, {title, description}); toast('Norma añadida correctamente.'); }
      S.normaForm = null; S.normaDraft = null;
      await renderNormas();
    }catch(err){
      // el formulario sigue abierto con lo escrito
      btn.disabled = false; toast(friendly(err));
    }
  };
}

      </div>

        <p class="small dim" id="inviteUrl" style="overflow-wrap:anywhere;margin:10px 0 0">${esc(inviteUrl(apt.invite_code))}</p>
        <button class="link" id="copyUrl">Copiar enlace</button>

      <ul class="list">${S.members.map(m => {
        const puedeEchar = m.id !== S.api.uid && m.id !== apt.owner_id;

        <li style="flex-wrap:wrap"><span class="mag-dot mag ${mc(m.id)}">${dotInner(m)}</span>

          ${puedeEchar && S.echar !== m.id ? `<button type="button" class="link" data-echar="${esc(m.id)}" aria-label="Echar a ${esc(m.name)} del piso">Echar</button>` : ''}
          ${puedeEchar && S.echar === m.id ? `<div class="confirm" role="alertdialog" aria-label="Confirmar" style="flex-basis:100%">
            <span>¿Echar a <b>${esc(m.name)}</b> del piso? Dejará de verlo y sus turnos de limpieza pendientes pasarán a otros.${

    b.disabled = true;

    const q = window.qrcode(0, 'M'); q.addData(url); q.make();
    $('#qrImg').innerHTML = q.createImgTag(6, 0, 'Código QR de invitación');
    const im = $('#qrImg img'); im.style.cssText = 'width:min(220px,60vw);height:auto;image-rendering:pixelated';
  };

/* Compra común, agrupada por el día en que se añadió (TEO-11) */
function quienCompro(i){
  if (!i.bought_by) return 'Comprado';
  const quien = i.bought_by === S.api.uid ? 'Lo compraste tú' : `Lo compró ${S.members.find(m => m.id === i.bought_by)?.name || 'un antiguo compañero'}`;
  if (!i.bought_at) return quien;
  const d = new Date(i.bought_at);
  return `${quien} · ${dayLabel(i.bought_at).toLowerCase()}, ${d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`;
}
// De la compra al gasto: quien lo compró puede anotar lo que costó y se reparte entre todos
function precioCompra(i){
  if (i.expense && !i.expense.deleted_at) return `<br><span class="small" style="font-weight:800">Gasto anotado: ${eur(i.expense.amount)}, repartido entre todos</span>`;
  if (i.bought_by !== S.api.uid) return '';
  if (S.precioItem === i.id) return `<form class="precio" data-precio="${esc(i.id)}" novalidate>
      <input id="precioIn" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="€" aria-label="Lo que costó ${esc(i.name)}">
      <button class="btn small" type="submit">Anotar</button><button class="btn ghost small" type="button" data-precio-no>Cancelar</button>
      <small class="err" id="ePrecio" role="alert" hidden style="flex-basis:100%"></small></form>`;
  return `<br><button type="button" class="link" data-precio-abrir="${esc(i.id)}" style="min-height:36px">¿Cuánto costó? Anótalo como gasto</button>`;
}
function filaCompra(i){
  if (S.editItem === i.id) return `
    <li><form class="row grow" data-edit="${esc(i.id)}">
      <input id="editName" maxlength="80" value="${esc(i.name)}" aria-label="Nuevo nombre de ${esc(i.name)}" required>
      <button class="btn small" type="submit">Guardar</button>
      <button class="btn ghost small" type="button" id="cancelEdit">Cancelar</button></form></li>`;
  return `
    <li><button class="check" aria-pressed="${i.is_bought}" data-b="${esc(i.id)}" aria-label="${i.is_bought?'Marcar como pendiente':'Marcar como comprado'}: ${esc(i.name)}">${CHECK}</button>
      ${i.is_bought ? `<span class="grow"><span class="name done">${esc(i.name)}</span><br><span class="small dim">${esc(quienCompro(i))}</span>${precioCompra(i)}</span>`
        : `<span class="grow name">${esc(i.name)}</span>`}
      <button class="x" data-e="${esc(i.id)}" aria-label="Editar ${esc(i.name)}">${PENCIL}</button>
      <button class="x" data-d="${esc(i.id)}" aria-label="Quitar ${esc(i.name)}">${CROSS}</button></li>`;
}
async function renderCompra(){
  const items = await S.api.items(S.apt.id);
  const pend = items.filter(i => !i.is_bought);
  const comprados = items.filter(i => i.is_bought).sort((a,b) => String(b.bought_at||'').localeCompare(String(a.bought_at||'')));

  // agrupar los pendientes por día, del más reciente al más antiguo
  const dias = [];
  for (const i of pend){
    const et = dayLabel(i.created_at);
    const g = dias.find(x => x.et === et);
    if (g) g.items.push(i); else dias.push({ et, items:[i] });
  }
  const bloque = (et, lista) => `<div class="day">${esc(et)} <span class="n">${lista.length}</span></div>
    <ul class="list">${lista.map(filaCompra).join('')}</ul>`;

  app.innerHTML = `${header('Compra común')}${subtabsHtml('compra', {pend:pend.length, hechos:comprados.length})}
    <section class="sec">
      <div data-g="pend">
      <div class="sec-head"><h2>Por comprar</h2><span class="count">${pend.length}</span></div>
      <p class="sub">Lo que falta en casa, agrupado por el día en que se apuntó. Tacha lo que compres.</p>
      <form class="row" id="fItem" style="margin-bottom:4px">
        <input id="itemName" maxlength="80" placeholder="Añadir producto: leche, pan…" aria-label="Producto" required>
        <button class="btn" type="submit">Añadir</button>
      </form>
      ${pend.length ? dias.map(d => bloque(d.et, d.items)).join('')
        : '<p class="empty">Nada pendiente. La nevera está a salvo.</p>'}
      </div>
      <div data-g="hechos">
      <div class="sec-head"><h2>Ya comprado</h2><span class="count">${comprados.length}</span></div>
      ${comprados.length ? `<ul class="list">${comprados.map(filaCompra).join('')}</ul>` + '<p class="small dim" style="margin:6px 2px 0">Si tachaste algo por error, vuelve a pulsarlo y regresa a «Por comprar». Si lo compraste tú, puedes anotar lo que costó.</p>'
        : '<p class="empty">Todavía no se ha tachado nada.</p>'}
      </div>
    </section>`;
  aplicarSub('compra');

  $('#fItem').onsubmit = e => run(e, async () => { await S.api.addItem(S.apt.id, $('#itemName').value.trim()); await renderCompra(); });
  app.querySelectorAll('[data-b]').forEach(b => b.onclick = async () => {
    if (b.disabled) return; b.disabled = true;
    try{ await S.api.setBought(b.dataset.b, b.getAttribute('aria-pressed') !== 'true'); }catch(err){ toast(friendly(err)); }
    await renderCompra();
  });
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
    try{ await S.api.delItem(b.dataset.d); await renderCompra(); }catch(err){ toast(friendly(err)); }
  });
  app.querySelectorAll('[data-precio-abrir]').forEach(b => b.onclick = async () => { S.precioItem = b.dataset.precioAbrir; await renderCompra(); $('#precioIn')?.focus(); });
  app.querySelectorAll('[data-precio-no]').forEach(b => b.onclick = async () => { S.precioItem = null; await renderCompra(); });
  const fp = app.querySelector('form[data-precio]');
  if (fp){
    $('#precioIn').addEventListener('input', () => clearFieldError('pPrecio'));
    fp.onsubmit = async e => {
      e.preventDefault();
      const amount = Math.round(parseFloat($('#precioIn').value) * 100) / 100;
      if (!(amount > 0)){ const er = $('#ePrecio'); er.textContent = 'Indica lo que costó (más de 0 €).'; er.hidden = false; $('#precioIn').focus(); return; }
      const btn = fp.querySelector('button[type=submit]'); btn.disabled = true;
      try{ await S.api.buyItemWithExpense(fp.dataset.precio, amount); S.precioItem = null; toast(`Gasto anotado: ${eur(amount)} entre ${S.members.length}. Lo verás en Gastos.`); await renderCompra(); }
      catch(err){ btn.disabled = false; toast(friendly(err)); }
    };
  }
  app.querySelectorAll('[data-e]').forEach(b => b.onclick = async () => {
    S.editItem = b.dataset.e; await renderCompra(); const inp = $('#editName'); if (inp){ inp.focus(); inp.select(); }
  });
  const fe = app.querySelector('form[data-edit]');
  if (fe){
    fe.onsubmit = e => run(e, async () => { await S.api.renameItem(fe.dataset.edit, $('#editName').value.trim()); S.editItem = null; toast('Producto actualizado.'); await renderCompra(); });
    $('#cancelEdit').onclick = async () => { S.editItem = null; await renderCompra(); };
  }
}

/* Limpieza: recordatorio del turno e histórico */
// La semana actual la decide el servidor (hora de Madrid), no el reloj del móvil
const curMonday = () => new Date(S.mon || mondayOf());
async function loadWeek(){
  try{ S.mon = new Date((await S.api.weekStart()) + 'T00:00:00'); if (isNaN(S.mon)) S.mon = null; }catch{ S.mon = null; }
}
const SOLO_UNO = 'Hacen falta al menos 2 compañeros para rotar los turnos. Cuando se una alguien, la rotación empezará sola.';
function fmtDoneAt(when){
  const d = new Date(when); if (isNaN(d)) return '';
  return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}) + ', ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}
function weekRange(mon){
  const end = new Date(mon); end.setDate(end.getDate()+6);
  return `${mon.toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}`;
}
function plazoWords(){
  const end = new Date(curMonday()); end.setDate(end.getDate()+6);
  const f = end.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}).replace(',','');
  const n = daysUntil(iso(end));
  if (n <= 0) return `Plazo: hoy, ${f}. Es el último día.`;
  return `Plazo: ${f}. ${n===1?'Queda 1 día':'Quedan '+n+' días'}.`;
}
function turnoHtml(asg){
  if (!asg) return '';
  const range = weekRange(curMonday());
  if (S.members.length < 2) return `<section class="turno vacio" aria-live="polite"><div class="turno-top"><b>Tu turno de limpieza</b></div><p>${esc(SOLO_UNO)}</p></section>`;
  if (!asg.length) return `<section class="turno vacio" aria-live="polite"><div class="turno-top"><b>Tu turno de limpieza</b></div>
    <p>Todavía no hay rotación esta semana. Define las zonas del piso y se generará sola.</p><button class="link" data-go="limpieza" data-subgo="zonas">Ir a Limpieza</button></section>`;
  const mine = asg.filter(a => a.user_id === S.api.uid);
  if (!mine.length) return `<section class="turno vacio" aria-live="polite"><div class="turno-top"><b>Esta semana no tienes turno</b></div>
    <p>No se te ha asignado ninguna zona (semana del ${esc(range)}). No tienes que hacer nada.</p></section>`;
  const hechas = mine.filter(a => a.is_done).length, todo = hechas === mine.length;

function historicoHtml(hist, currentWeek){
  if (hist === null) return `<section class="sec" id="hist"><h2>Histórico de limpieza</h2><p class="sub">No se ha podido cargar el histórico. Prueba a actualizar.</p><button class="btn ghost small" id="histRefresh">Actualizar</button></section>`;

    <p class="sub">Aún no hay turnos registrados. Cuando pase la primera semana verás aquí quién ha cumplido.</p></section>`;
  const weeks = []; hist.forEach(h => { let w = weeks.find(x => x.week === h.week); if (!w){ w = {week:h.week, rows:[]}; weeks.push(w); } w.rows.push(h); });
  const cumple = new Map();
  hist.filter(h => h.week < currentWeek).forEach(h => { const c = cumple.get(h.user_id) || {name:h.name,hechas:0,total:0}; c.total++; if (h.is_done) c.hechas++; cumple.set(h.user_id, c); });

    ${(S.histTodo ? weeks : weeks.slice(0, 2)).map(w => { const mon = new Date(w.week+'T00:00:00'); const cur = w.week === currentWeek; const past = w.week < currentWeek;

      <ul class="list">${w.rows.map(h => `<li><span class="grow"><span class="name">${esc(h.zone)}</span>

  ${weeks.length > 2 && !S.histTodo ? `<button class="btn ghost small" id="histMas" style="margin-top:12px">Ver ${weeks.length - 2} semanas más</button>` : ''}

/* Facturas periódicas: alta, reparto entre compañeros y pago de tu parte (TEO-34, TEO-31) */
function dayLabel(when){
  if (!when) return 'Sin fecha';
  const d = new Date(when); if (isNaN(d)) return 'Sin fecha';
  const hoy = new Date(); const dia = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const dif = Math.round((dia(hoy) - dia(d)) / 864e5);
  if (dif <= 0) return 'Hoy';
  if (dif === 1) return 'Ayer';
  if (dif < 7) return d.toLocaleDateString('es-ES',{weekday:'long'});
  return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
}

/* ===== Pestaña Gastos =====
   Saldos (quién debe a quién y Saldar) · Movimientos (gastos sueltos, gastos de facturas y pagos)
   · Facturas periódicas. Los cálculos de saldos los hace Supabase (vista apartment_balances). */

// Quién paga a quién para quedar en paz, con el menor número de pagos
function repartoDeudas(bal){
  const deudores = [], acreedores = [];
  Object.entries(bal).forEach(([u, v]) => { const c = Math.round(v*100); if (c < 0) deudores.push([u, -c]); else if (c > 0) acreedores.push([u, c]); });
  deudores.sort((a,b) => b[1]-a[1]); acreedores.sort((a,b) => b[1]-a[1]);
  const out = []; let i = 0, j = 0;
  while (i < deudores.length && j < acreedores.length){
    const x = Math.min(deudores[i][1], acreedores[j][1]);
    if (x > 0) out.push({from:deudores[i][0], to:acreedores[j][0], amount:x/100});
    deudores[i][1] -= x; acreedores[j][1] -= x;
    if (!deudores[i][1]) i++; if (!acreedores[j][1]) j++;
  }
  return out;
}
