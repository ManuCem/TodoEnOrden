          <span class="small dim">Vencimiento del ${esc(fmtDate(g.date))} · ${g.paid_by === yo ? 'la adelantaste tú' : 'la adelantó ' + esc(nombreDe(g.paid_by))}</span></span>
          <span class="right"><span class="amount">${eur(g.amount)}</span><span class="small dim">${resumen}</span></span></span>
        ${chipsReparto(g, pagado)}
        ${mia && g.paid_by !== yo ? `<span class="meta-line"><button class="btn small ${yoPago ? 'ghost' : ''}" data-pay="${esc(g.bill_id)}" data-due="${esc(g.date)}" data-on="${yoPago}">${yoPago ? 'Ya he pagado mi parte ✓' : `Pagar mi parte (${eur(mia.amount)})`}</button></span>` : ''}
        ${faltan === 0 ? '<span class="meta-line"><span class="state ok">Saldado entre todos</span></span>' : ''}</li>`;
    }
    return `<li class="mov suelto"><span class="mov-top"><span><span class="tag-mov">Gasto</span><span class="name">${esc(g.name)}</span><br>
        <span class="small dim">${esc(fmtDate(g.date))} · ${g.paid_by === yo ? 'pagaste tú' : 'pagó ' + esc(nombreDe(g.paid_by))}</span></span>
        <span class="right"><span class="amount">${eur(g.amount)}</span><span class="small dim">${resumen}</span></span></span>
      ${chipsReparto(g, u => u === g.paid_by)}
      ${irSaldos(g)}
      ${g.created_by === yo ? borrar(m, `Eliminar «${esc(g.name)}» (${eur(g.amount)})`) : ''}</li>`;
  };
  const cuenta = t => mov.filter(m => t === 'todos' || m.tipo === t).length;
  return `<section class="sec" id="movs">
    <div class="sec-head"><h2>Movimientos</h2><span class="count">${mov.length}</span></div>
    <p class="sub">Gastos que alguien adelanta, gastos de las facturas y pagos entre compañeros.</p>
    ${S.gastoForm ? formGastoHtml() : '<button class="btn" id="gAdd">Anotar gasto</button>'}
    <div class="filtros" role="group" aria-label="Filtrar movimientos">${[['todos','Todos'],['suelto','Gastos'],['factura','Facturas'],['pago','Pagos']].map(([k,v]) =>
      `<button type="button" class="filtro" data-filtro="${k}" aria-pressed="${filtro === k}">${v} <span>${cuenta(k)}</span></button>`).join('')}</div>
    ${visibles.length ? `<ul class="list receipt">${visibles.map(item).join('')}</ul>` : '<p class="empty">No hay movimientos de este tipo.</p>'}
    ${lista.length > visibles.length ? `<button class="btn ghost small" id="movMas" style="margin-top:10px">Ver ${lista.length - visibles.length} más</button>` : ''}
  </section>`;
}

function facturasHtml(bills, pagos){
  const n = Math.max(S.members.length, 1), yo = S.api.uid;
  const who = id => S.members.find(m => m.id === id)?.name || 'un antiguo compañero';
  const ed = S.editBill ? bills.find(b => b.id === S.editBill) : null;
  const abierto = !!ed || S.billForm;
  const fila = b => {
    const d = daysUntil(b.next_due_date), urgent = d < 3;
    const label = d < 0 ? `Vencida hace ${-d} d` : d === 0 ? 'Vence hoy' : d === 1 ? 'Vence mañana' : d === 2 ? 'Vence en 2 días' : `En ${d} d`;
    const due = d < 0 ? `<span class="due late">${label}</span>` : urgent ? `<span class="due soon">${label}</span>` : `<span class="due dim">${label}</span>`;
    const parte = Number(b.amount) / n;
    const hechos = pagos.filter(p => p.bill_id === b.id && p.due_date === b.next_due_date);
    const yoPago = hechos.some(p => p.user_id === yo), todos = hechos.length >= n;
    const acts = `<span class="acts"><button type="button" class="link" data-edit="${esc(b.id)}" aria-label="Editar ${esc(b.name)}">Editar</button>
        <button type="button" class="link" data-pause="${esc(b.id)}" data-to="${!b.is_paused}" aria-label="${b.is_paused ? 'Reanudar' : 'Pausar'} ${esc(b.name)}">${b.is_paused ? 'Reanudar' : 'Pausar'}</button></span>`;
    if (b.is_paused) return `<li class="paused"><span class="grow"><span class="name">${esc(b.name)}</span><br>
        <span class="small dim">${esc(fmtDate(b.next_due_date))} · se repite ${esc(REPITE[b.frequency] || 'cada mes')} · la adelanta ${esc(who(b.paid_by))}</span>
        <span class="meta-line"><span class="state">No genera gastos mientras esté en pausa</span></span>${acts}</span>
      <span class="right"><span class="amount">${eur(b.amount)}</span><span class="due dim">En pausa</span></span></li>`;
    return `<li class="${urgent && !todos ? 'urgent' : ''}"><span class="grow"><span class="name">${esc(b.name)}</span><br>
        <span class="small dim">${esc(fmtDate(b.next_due_date))} · se repite ${esc(REPITE[b.frequency] || 'cada mes')} · la adelanta ${esc(who(b.paid_by))}</span>
        ${d < 0 && !S.members.some(m => m.id === b.paid_by) ? '<span class="meta-line"><span class="state late">No se puede crear su gasto: quien la adelantaba ya no está en el piso</span></span>' : ''}
        <span class="meta-line">${S.members.map(m => { const ok2 = hechos.some(p => p.user_id === m.id); return `<span class="state ${ok2 ? 'ok' : ''}">${esc(m.name)}${ok2 ? ' ✓' : ''}</span>`; }).join('')}</span>
        <span class="meta-line"><button class="btn small ${yoPago ? 'ghost' : ''}" data-pay="${esc(b.id)}" data-due="${esc(b.next_due_date)}" data-on="${yoPago}">${yoPago ? 'Ya he pagado mi parte ✓' : `Pagar mi parte (${eur(parte)})`}</button></span>
        ${todos ? '<span class="meta-line"><span class="state ok">Pagada entre todos</span></span>' : ''}${acts}</span>
      <span class="right"><span class="amount">${eur(b.amount)}</span><span class="small dim">tu parte ${eur(parte)}</span>${due}</span></li>`;
  };
  const form = !abierto ? '<button class="btn ghost" id="billAdd" style="margin-top:12px">Nueva factura periódica</button>' : `
    <h3 class="wk" id="fBillTitle">${ed ? 'Editar factura' : 'Nueva factura periódica'}</h3>
    <p class="sub">${ed ? `Los cambios se aplican a los próximos gastos de «${esc(ed.name)}». Los gastos ya creados no cambian.${ed.is_paused ? ' Sigue en pausa hasta que la reanudes.' : ''}` : 'Se guarda una vez y vuelve sola en cada vencimiento.'}</p>
    <form class="panel" id="fBill" novalidate>
      <label>Nombre<input id="bName" maxlength="60" placeholder="Luz" value="${esc(ed ? ed.name : '')}"><small class="err" id="eName" role="alert" hidden></small></label>
      <div class="row">
        <label>Importe (€)<input id="bAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="72,40" value="${ed ? esc(ed.amount) : ''}"><small class="err" id="eAmount" role="alert" hidden></small></label>
        <label>Se repite<select id="bFreq">${Object.entries(FREQ).map(([k,v]) => `<option value="${k}" ${k === (ed ? ed.frequency : 'monthly') ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      </div>
      <div class="row">
        <label>${ed ? 'Próximo vencimiento' : 'Fecha de vencimiento'}<input id="bDate" type="date" value="${ed ? esc(ed.next_due_date) : ''}"><small class="err" id="eDate" role="alert" hidden></small></label>
        <label>La adelanta<select id="bPaid">${ed && !S.members.some(m => m.id === ed.paid_by) ? `<option value="${esc(ed.paid_by)}" selected>Antiguo compañero</option>` : ''}${S.members.map(m => `<option value="${esc(m.id)}" ${m.id === (ed ? ed.paid_by : yo) ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select><small class="err" id="ePaid" role="alert" hidden></small></label>
      </div>
      ${ed && !ed.is_paused ? '<p class="small dim" style="margin:0">Si pones una fecha ya pasada, al guardar se crearán los gastos de esos vencimientos con el importe nuevo.</p>' : ''}
      <button class="btn" type="submit">${ed ? 'Guardar cambios' : 'Dar de alta'}</button>
      <button class="btn ghost" type="button" id="cancelEdit">Cancelar</button>
    </form>`;
  return `<section class="sec" id="facts">
    <div class="sec-head"><h2>Facturas periódicas</h2><span class="count">${bills.length}</span></div>
    <p class="sub">Se repiten solas. El día que vencen se crea su gasto en Movimientos, repartido entre los ${n === 1 ? 'del piso' : n + ' compañeros'}.</p>
    <ul class="list receipt">${bills.length ? bills.map(fila).join('') : '<li class="empty">Todavía no hay facturas. Da de alta la luz, el agua o el internet y se repetirán solas.</li>'}</ul>
    ${form}
  </section>`;
}

async function renderFacturas(){
  await autoExpenses();
  const apt = S.apt;
  const [manuales, bills, pagos, gastos, bal, pays] = await Promise.all([
    S.api.expenses(apt.id).catch(() => []),
    S.api.bills(apt.id),
    S.api.billPayments(apt.id).catch(() => []),
    S.api.billExpenses(apt.id).catch(() => []),
    S.api.balances(apt.id).catch(() => null),
    S.api.payments(apt.id).catch(() => [])
  ]);
  if (S.apt !== apt || S.tab !== 'facturas') return;
  bills.sort((a,b) => (a.is_paused - b.is_paused) || a.next_due_date.localeCompare(b.next_due_date) || a.name.localeCompare(b.name,'es'));
  S.bills = bills;
  if (S.editBill && !bills.some(b => b.id === S.editBill)) S.editBill = null;
  const mov = [
    // orden: por fecha y, el mismo día, lo último anotado primero
    ...manuales.map(g => ({tipo:'suelto', key:'g:' + g.id, date:g.date, ts:g.date + '|' + (g.created_at || ''), g})),
    ...gastos.map(g => ({tipo:'factura', key:'f:' + g.id, date:g.date, ts:g.date + '|', g, pagos})),
    ...pays.map(p => { const d = iso(new Date(p.paid_at)); return {tipo:'pago', key:'p:' + p.id, id:p.id, date:d, ts:d + '|' + p.paid_at, from:p.from_user, to:p.to_user, amount:Number(p.amount), created_by:p.created_by}; })
  ].sort((a,b) => b.ts.localeCompare(a.ts));
  app.innerHTML = `${header('Gastos y facturas')}${subtabsHtml('facturas', {movs:mov.length, facts:bills.length})}${saldosHtml(bal)}${movimientosHtml(mov)}${facturasHtml(bills, pagos)}`;
  aplicarSub('facturas');
  bindGastos(bills, mov);
}

function bindGastos(bills, mov){
  const re = () => renderFacturas();
  // Saldar
  app.querySelectorAll('[data-saldar]').forEach(b => b.onclick = () => { S.saldar = b.dataset.saldar; re(); });
  app.querySelectorAll('[data-saldar-no]').forEach(b => b.onclick = () => { S.saldar = null; re(); });
  app.querySelectorAll('[data-saldar-ok]').forEach(b => b.onclick = async () => {
    b.disabled = true; const [from, to] = b.dataset.saldarOk.split('|'), amount = Number(b.dataset.amount);
    try{ await S.api.addPayment(S.apt.id, {from, to, amount}); toast(from === S.api.uid ? `Anotado: has pagado ${eur(amount)} a ${nombreDeMin(to)}.` : `Anotado: ${nombreDe(from)} te ha pagado ${eur(amount)}.`); }
    catch(err){ toast(friendly(err)); }
    S.saldar = null; re();
  });
  // Movimientos: filtros, ver más, eliminar / deshacer
  app.querySelectorAll('[data-filtro]').forEach(b => b.onclick = () => { S.movFiltro = b.dataset.filtro; S.movTodos = false; re(); });
  const mas = $('#movMas'); if (mas) mas.onclick = () => { S.movTodos = true; re(); };
  app.querySelectorAll('[data-mdel]').forEach(b => b.onclick = () => { S.movDel = b.dataset.mdel; re(); });
  app.querySelectorAll('[data-mdel-no]').forEach(b => b.onclick = () => { S.movDel = null; re(); });
  app.querySelectorAll('[data-mdel-ok]').forEach(b => b.onclick = async () => {
    b.disabled = true; const [t, idm] = [b.dataset.mdelOk.slice(0,1), b.dataset.mdelOk.slice(2)];
    try{
      if (t === 'p'){ await S.api.delPayment(idm); toast('Pago deshecho.'); }
      else { await S.api.delExpense(idm); toast('Gasto eliminado.'); }
    }catch(err){ toast(friendly(err)); }
    S.movDel = null; re();
  });
  // Pagar mi parte de una factura (tanto en la factura como en su gasto)
  app.querySelectorAll('[data-pay]').forEach(btn => btn.onclick = async () => {
    btn.disabled = true;
    try{
      if (btn.dataset.on === 'true') await S.api.unpayShare(btn.dataset.pay, btn.dataset.due);
      else { await S.api.payShare(S.apt.id, btn.dataset.pay, btn.dataset.due); toast('Tu parte queda marcada como pagada.'); }
    }catch(err){ toast(friendly(err)); }
    re();
  });
  bindFormGasto();
  bindFacturas(bills);
}

function bindFormGasto(){
  const add = $('#gAdd'); if (add) add.onclick = async () => { S.gastoForm = true; S.movDel = null; await renderFacturas(); $('#gImporte')?.focus(); };
  const f = $('#fGasto'); if (!f) return;
  const tipo = () => f.querySelector('input[name=gTipo]:checked').value;
  const filas = () => [...f.querySelectorAll('.part-row')].map(r => ({u:r.querySelector('input[type=checkbox]').value, on:r.querySelector('input[type=checkbox]').checked, val:r.querySelector('.part-val')}));
  const preview = () => {
    const a = Math.round(parseFloat($('#gImporte').value) * 100) / 100, on = filas().filter(x => x.on), t = tipo();
    filas().forEach(x => { x.val.hidden = t === 'equal' || !x.on; x.val.placeholder = t === 'percentage' ? '%' : '€'; });
    let txt = '';
    if (t === 'equal') txt = a > 0 && on.length ? `${on.length === 1 ? 'Una persona' : on.length + ' personas'}: ${eur(Math.floor(a*100/on.length)/100)}${Math.round(a*100) % on.length ? ' aprox.' : ''} cada una.` : '';
    else {
      const sum = on.reduce((s, x) => s + (parseFloat(x.val.value) || 0), 0);
      if (t === 'exact') txt = a > 0 ? (Math.abs(sum - a) < 0.005 ? `Cuadra: ${eur(sum)} de ${eur(a)}.` : sum < a ? `Faltan ${eur(a - sum)} por repartir.` : `Te pasas en ${eur(sum - a)}.`) : `Repartido: ${eur(sum)}.`;
      else txt = Math.abs(sum - 100) < 0.001 ? 'Cuadra: 100 %.' : `Suman ${Math.round(sum*100)/100} % (tienen que sumar 100 %).`;
    }
    $('#gPreview').textContent = txt;
  };
  preview();
  f.querySelectorAll('input[name=gTipo]').forEach(r => r.addEventListener('change', () => { S.gastoTipo = tipo(); clearFieldError('gPart'); preview(); }));
  $('#gImporte').addEventListener('input', () => { clearFieldError('gImporte'); preview(); });
  $('#gFecha').addEventListener('input', () => clearFieldError('gFecha'));
  f.querySelectorAll('#gPart input').forEach(i => i.addEventListener('input', () => { clearFieldError('gPart'); preview(); }));
  f.querySelectorAll('#gPart input[type=checkbox]').forEach(i => i.addEventListener('change', preview));
  $('#gCancel').onclick = async () => { S.gastoForm = false; await renderFacturas(); };
  const fail = (idc, msg) => { const er = document.getElementById('e' + idc.slice(1)); er.textContent = msg; er.hidden = false; const el = document.getElementById(idc); el.setAttribute('aria-invalid','true'); return el; };
  f.onsubmit = async e => {
    e.preventDefault();
    const amount = Math.round(parseFloat($('#gImporte').value) * 100) / 100, t = tipo(), on = filas().filter(x => x.on);
    const participants = on.map(x => x.u), values = t === 'equal' ? null : on.map(x => Math.round((parseFloat(x.val.value) || 0) * 100) / 100);
    const date = $('#gFecha').value || iso(new Date());
    let first = null; const mark = el => { if (!first) first = el; };
    if (!(amount > 0)) mark(fail('gImporte', 'Falta el importe (debe ser un número mayor que 0).'));
    else if (amount > 100000) mark(fail('gImporte', 'El importe es demasiado alto. Revisa la cifra.'));
    if (!participants.length) mark(fail('gPart', 'Debes indicar al menos un participante.'));
    else if (t !== 'equal' && values.some(v => v < 0)) mark(fail('gPart', 'Las cantidades no pueden ser negativas.'));
    else if (t === 'exact' && amount > 0 && Math.abs(values.reduce((s,v) => s+v, 0) - amount) >= 0.005) mark(fail('gPart', `Los importes tienen que sumar exactamente ${eur(amount)}.`));
    else if (t === 'percentage' && Math.abs(values.reduce((s,v) => s+v, 0) - 100) >= 0.001) mark(fail('gPart', 'Los porcentajes tienen que sumar 100 %.'));
    if (date > iso(new Date())) mark(fail('gFecha', 'La fecha no puede ser futura.'));
    if (first){ (first.tagName === 'FIELDSET' ? first.querySelector('input') : first).focus(); return; }
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    const description = $('#gConcepto').value.trim() || 'Gasto sin concepto';
    try{
      await S.api.addExpense(S.apt.id, {description, amount, paid_by:$('#gPayer').value, participants, split:t, values, date});
      S.gastoForm = false; S.movFiltro = 'todos'; toast(`Gasto anotado: ${eur(amount)} entre ${participants.length}.`);
      await renderFacturas();
    }catch(err){ btn.disabled = false; toast(friendly(err)); }   // el formulario conserva lo escrito
  };
}

function bindFacturas(bills){
  const add = $('#billAdd'); if (add) add.onclick = async () => { S.billForm = true; S.editBill = null; await renderFacturas(); $('#fBill')?.scrollIntoView({behavior:'smooth', block:'center'}); $('#bName')?.focus({preventScroll:true}); };
  const ce = $('#cancelEdit'); if (ce) ce.onclick = () => { S.editBill = null; S.billForm = false; renderFacturas(); };
  app.querySelectorAll('[data-edit]').forEach(b => b.onclick = async () => {
    S.editBill = b.dataset.edit; await renderFacturas();
    $('#fBill')?.scrollIntoView({behavior:'smooth', block:'center'}); $('#bAmount')?.focus({preventScroll:true});
  });
  app.querySelectorAll('[data-pause]').forEach(b => b.onclick = async () => {
    const bill = bills.find(x => x.id === b.dataset.pause); if (!bill) return;
    b.disabled = true;
    try{
      if (b.dataset.to === 'true'){ await S.api.updateBill(bill.id, {is_paused:true}); toast('Factura en pausa: no generará gastos.'); }
      else {
        // al reanudar no se cobran los meses en pausa: el vencimiento salta al siguiente que no haya pasado
        const hoy = iso(new Date()), antes = bill.next_due_date; let d = antes;
        for (let k = 0; d < hoy && k < 600; k++) d = shiftDue(d, bill.frequency);
        await S.api.updateBill(bill.id, {is_paused:false, next_due_date:d});
        toast(d !== antes ? `Factura reanudada. Próximo vencimiento: ${fmtDate(d)}.` : 'Factura reanudada.');
      }
      await renderFacturas();
    }catch(err){ b.disabled = false; toast(friendly(err)); }
  });
  const fb = $('#fBill'); if (!fb) return;
  const ed = S.editBill ? bills.find(b => b.id === S.editBill) : null;
  ['bName','bAmount','bDate','bPaid'].forEach(id => $('#'+id).addEventListener('input', () => clearFieldError(id)));
  fb.onsubmit = e => run(e, async () => {
    ['bName','bAmount','bDate','bPaid'].forEach(clearFieldError);
    let first = null;
    const fail = (id, msg) => { const el = $('#'+id), er = $('#e'+id.slice(1)); er.textContent = msg; er.hidden = false; el.classList.add('invalid'); el.setAttribute('aria-invalid','true'); first = first || el; };
    const name = $('#bName').value.trim(), amount = Number($('#bAmount').value), date = $('#bDate').value, paid = $('#bPaid').value;
    if (!name) fail('bName', 'Escribe el nombre de la factura.');
    if (!(amount > 0)) fail('bAmount', 'Indica un importe mayor que 0.');
    if (!date) fail('bDate', 'Indica la fecha de vencimiento.');
    if (!S.members.some(m => m.id === paid)) fail('bPaid', 'Elige quién la adelanta: esa persona ya no está en el piso.');
    if (first){ first.focus(); return; }
    const datos = {name, amount, frequency:$('#bFreq').value, next_due_date:date, paid_by:paid};
    if (ed){ await S.api.updateBill(ed.id, datos); S.editBill = null; toast('Factura actualizada.'); }
    else { await S.api.addBill(S.apt.id, datos); S.billForm = false; toast('Factura dada de alta.'); }
    await renderFacturas();
  });
}

boot(new URLSearchParams(location.search).has('demo'));
