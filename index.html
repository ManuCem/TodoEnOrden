<style>
/* Tablon de la nevera: cada seccion es una nota pegada con celo sobre papel cuadriculado.
   Cada apartado tiene su color y cada companero su iman. */
:root{
  --paper:#FFFFFF;
  --ink:#16243A;
  --muted:#5A6A80;
  --line:#D5E2EF;
  --bad:#B3261E;
  --focus:#2F4F79;
  --alert-bg:#FFF0CF; --alert-ink:#5A3B00;
  --board:#E7F1FA; --board-2:#F6FAFE; --grid:rgba(47,79,121,.07);
  --tape:rgba(240,214,140,.75); --tape-edge:rgba(198,166,74,.5);
  --shadow:0 2px 0 rgba(22,36,58,.06), 0 10px 24px -14px rgba(22,36,58,.45);
  --primary:#2F4F79; --primary-on:#FFFFFF; --ok:#5B9A81;
  --accent:#2F4F79; --accent-soft:#DDE9F6;
  --m1:#D8644C; --m1t:#FFF; --m2:#EDB84A; --m2t:#16243A; --m3:#4E9A82; --m3t:#FFF;
  --m4:#6B79CC; --m4t:#FFF; --m5:#C45B8A; --m5t:#FFF; --m6:#3C8DB4; --m6t:#FFF;
  --font:'Archivo','Arial Narrow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#17222F; --ink:#E7EFF8; --muted:#9BAFC6; --line:#2B3C4F; --bad:#FF8E85; --focus:#9CC3EE;
  --alert-bg:#3A2F14; --alert-ink:#F5D48A;
  --board:#0D161F; --board-2:#111C27; --grid:rgba(156,195,238,.07);
  --tape:rgba(196,168,96,.4); --tape-edge:rgba(120,100,50,.5);
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 12px 26px -14px rgba(0,0,0,.9);
  --primary:#9CC3EE; --primary-on:#0E1A2A; --ok:#7BBFA3;
  --accent:#9CC3EE; --accent-soft:#1E3047; --m2t:#16243A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#17222F; --ink:#E7EFF8; --muted:#9BAFC6; --line:#2B3C4F; --bad:#FF8E85; --focus:#9CC3EE;
  --alert-bg:#3A2F14; --alert-ink:#F5D48A;
  --board:#0D161F; --board-2:#111C27; --grid:rgba(156,195,238,.07);
  --tape:rgba(196,168,96,.4); --tape-edge:rgba(120,100,50,.5);
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 12px 26px -14px rgba(0,0,0,.9);
  --primary:#9CC3EE; --primary-on:#0E1A2A; --ok:#7BBFA3;
  --accent:#9CC3EE; --accent-soft:#1E3047; --m2t:#16243A; color-scheme:dark;
}
/* color propio de cada apartado */
body[data-tab="piso"]     { --accent:#2F4F79; --accent-soft:#DDE9F6 }
body[data-tab="compra"]   { --accent:#3F8F6B; --accent-soft:#DCEFE6 }
body[data-tab="limpieza"] { --accent:#3C8DB4; --accent-soft:#D9ECF6 }
body[data-tab="facturas"] { --accent:#B07B18; --accent-soft:#FBEED2 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body[data-tab="piso"]{--accent:#9CC3EE;--accent-soft:#1E3047}
  :root:not([data-theme="light"]) body[data-tab="compra"]{--accent:#7BC5A2;--accent-soft:#17302A}
  :root:not([data-theme="light"]) body[data-tab="limpieza"]{--accent:#7FC0DE;--accent-soft:#15303E}
  :root:not([data-theme="light"]) body[data-tab="facturas"]{--accent:#E9BC63;--accent-soft:#35290F} }
:root[data-theme="dark"] body[data-tab="piso"]{--accent:#9CC3EE;--accent-soft:#1E3047}
:root[data-theme="dark"] body[data-tab="compra"]{--accent:#7BC5A2;--accent-soft:#17302A}
:root[data-theme="dark"] body[data-tab="limpieza"]{--accent:#7FC0DE;--accent-soft:#15303E}
:root[data-theme="dark"] body[data-tab="facturas"]{--accent:#E9BC63;--accent-soft:#35290F}

*{box-sizing:border-box}
html,body{margin:0}
body{
  color:var(--ink); font:16px/1.45 var(--font);
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/22px 22px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/22px 22px,
    radial-gradient(120% 80% at 50% 0%, var(--board-2), var(--board) 70%);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; min-height:100vh;
}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
h1,h2{margin:0;text-wrap:balance}
h1{font-weight:850;font-stretch:118%;font-size:33px;line-height:1.04;letter-spacing:-.02em;overflow-wrap:anywhere}
h2{font-weight:800;font-stretch:108%;font-size:19px;line-height:1.15;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}

.m1{--c:var(--m1);--ct:var(--m1t)} .m2{--c:var(--m2);--ct:var(--m2t)} .m3{--c:var(--m3);--ct:var(--m3t)}
.m4{--c:var(--m4);--ct:var(--m4t)} .m5{--c:var(--m5);--ct:var(--m5t)} .m6{--c:var(--m6);--ct:var(--m6t)}
.mag{background:var(--c);color:var(--ct)}

/* cabecera */
.top{padding:calc(14px + env(safe-area-inset-top,0px)) 0 16px}
.logo{display:block;width:72px;height:auto}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:14px;font-weight:600}
.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;background:var(--paper);
  border:1px solid var(--line);border-radius:99px;padding:5px 12px;box-shadow:var(--shadow)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status.demo i{background:var(--m2)}
.top h1{padding-left:14px;border-left:6px solid var(--accent)}

/* cuenta de Google: avatar y menu */
.meta{position:relative}
.avatar{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);
  color:var(--ink);font-weight:800;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--shadow)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.chip.persona{display:inline-flex;align-items:center;gap:8px;padding:3px 13px 3px 3px;font-size:14px}
.chip.persona .cf{width:32px;height:32px;margin:0;vertical-align:baseline;flex:none}
.cfi{display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.3);font-weight:850}
.chip .cf{width:18px;height:18px;border-radius:50%;object-fit:cover;vertical-align:-4px;margin-right:6px}
.mag-dot{overflow:hidden}
.mag-dot img{width:100%;height:100%;object-fit:cover;display:block}
.mag-dot.sm{width:26px;height:26px;font-size:12px}
.mini-m{display:inline-flex;align-items:center;gap:6px;margin:5px 12px 0 0}
.avatar.big{width:56px;height:56px;font-size:22px;box-shadow:none}
.perfil-head{display:flex;align-items:center;gap:14px}
.menu{position:absolute;right:0;top:calc(100% - 4px);z-index:20;min-width:220px;background:var(--paper);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);padding:6px}
.menu .who{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who b{font-size:16px}
.menu .who small{color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;font-weight:700}
.menu button:hover{background:var(--accent-soft)}

/* selector de pisos de ejemplo */
.pisos{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;margin:0 -2px;scrollbar-width:none}
.pisos::-webkit-scrollbar{display:none}
.pisos button{flex:none;background:var(--paper);border:1.5px solid var(--line);border-radius:99px;
  padding:8px 14px;font-size:14px;font-weight:700;color:var(--muted);box-shadow:var(--shadow);white-space:nowrap}
.pisos button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--primary-on)}
.pisos-label{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:6px}

/* notas pegadas al tablon */
.sec{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:4px 4px 14px 14px;
  padding:26px 16px 16px;margin:26px 0 0;box-shadow:var(--shadow)}
.sec::before{content:"";position:absolute;top:-11px;left:50%;width:92px;height:22px;transform:translateX(-50%) rotate(-1.6deg);
  background:var(--tape);border-left:1px dashed var(--tape-edge);border-right:1px dashed var(--tape-edge);border-radius:2px}
.sec:nth-of-type(even)::before{transform:translateX(-50%) rotate(1.4deg);left:46%}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{color:var(--accent)}
.count{font-size:13px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 10px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{margin:6px 0 12px;color:var(--muted);font-size:15px;max-width:44ch}

/* formularios */
.panel{background:var(--accent-soft);border-radius:12px;padding:14px;margin-top:14px;display:grid;gap:12px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{min-width:0}
.row>label,.row>input{flex:1}
label{display:grid;gap:5px;font-size:14px;font-weight:700}
input,select{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink)}
input::placeholder{color:var(--muted);opacity:.9}
.btn{min-height:48px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);
  color:var(--primary-on);font-weight:800;flex:none;box-shadow:0 2px 0 rgba(22,36,58,.12)}
.btn.ghost{background:var(--paper);color:var(--accent)}
.btn.danger{background:var(--paper);border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:40px;padding:6px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:wait}
.link{background:none;border:0;padding:6px 0;font-weight:800;text-decoration:underline;text-underline-offset:3px;color:var(--accent)}
#fBill .row{align-items:flex-start}
.err{color:var(--bad);font-size:13px;font-weight:700}
input.invalid,select.invalid{border-color:var(--bad)}

/* letras de nevera */
.tiles{display:flex;gap:7px;margin:10px 0;justify-content:center}
.tile{flex:1;max-width:56px;aspect-ratio:3/4;display:grid;place-items:center;border-radius:8px;
  font-weight:900;font-stretch:125%;font-size:30px;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.35)}
.tile:nth-child(odd){transform:rotate(-3deg)}
.tile:nth-child(even){transform:rotate(2.2deg) translateY(3px)}

/* listas */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);min-height:60px}
.list li:first-child{border-top:0}
.list.receipt li{border-top:1.5px dashed var(--line);align-items:flex-start}
.list.receipt li:first-child{border-top:0}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.name{font-weight:800;font-size:17px}
.small{font-size:14px}
.dim{color:var(--muted)}
.done{text-decoration:line-through;color:var(--muted)}
.mag-dot{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:850;
  font-stretch:115%;font-size:19px;box-shadow:0 2px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.3)}
.meta-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.meta-line .chip{margin-top:0}
.state{font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.state.ok{background:var(--ok);color:#fff;border-color:transparent}
.chip{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:800}
.you{font-size:13px;font-weight:800;border:1.5px solid var(--accent);color:var(--accent);border-radius:99px;padding:1px 9px}
.check{flex:none;width:32px;height:32px;border-radius:9px;border:2px solid var(--accent);background:var(--paper);
  display:grid;place-items:center;color:transparent}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.check:disabled{border-color:var(--line);cursor:not-allowed}
.check:disabled[aria-pressed="true"]{background:var(--line);color:var(--muted)}
.x{flex:none;width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.x:hover{color:var(--bad);background:var(--accent-soft)}
.amount{font-weight:850;font-stretch:112%;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.due{font-size:13px;font-weight:800;white-space:nowrap}
.due.soon{background:var(--m2);color:var(--m2t);padding:2px 9px;border-radius:99px}
.due.late{color:var(--bad)}
.right{display:grid;justify-items:end;gap:5px}
.day{display:flex;align-items:center;gap:10px;margin:16px 0 2px;font-size:12px;font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.day::after{content:"";flex:1;height:1.5px;background:var(--accent-soft)}
.day:first-child{margin-top:6px}
.day .n{font-weight:800;color:var(--muted);letter-spacing:0}
.empty{padding:18px 0;color:var(--muted);font-size:15px;display:block!important;min-height:0!important;text-align:center}

/* tramos de la semana */
.seg{display:flex;gap:4px;margin:12px 0 6px}
.seg i{flex:1;height:12px;border-radius:4px;background:var(--line)}
.seg i.on{background:var(--c)}

/* menu inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{background:transparent;border:0;border-radius:99px;min-height:46px;font-weight:800;font-size:15px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--primary-on);box-shadow:0 2px 0 rgba(22,36,58,.15)}

.notice{border:2px solid var(--bad);border-radius:12px;padding:14px;margin:0 0 16px;font-size:15px;background:var(--paper)}
.notice ol{margin:8px 0 0;padding-left:20px}
.alert{display:block;width:100%;text-align:left;margin:16px 0 0;padding:12px 14px;border:1.5px solid var(--m2);
  border-radius:12px;background:var(--alert-bg);color:var(--alert-ink);font-size:15px;font-weight:600;box-shadow:var(--shadow)}
.alert b{display:block;font-weight:900;margin-bottom:2px}
.turno{margin:16px 0 0;padding:14px;border:1.5px solid var(--m2);border-radius:12px;background:var(--alert-bg);color:var(--alert-ink);box-shadow:var(--shadow)}
.turno.ok{background:#E2F2E9;color:#14422B;border-color:#5B9A81}
.turno.vacio{background:var(--paper);color:var(--ink);border-color:var(--line)}
.turno-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.turno-top b{font-weight:900;font-size:17px}
.turno .badge{font-size:13px;font-weight:900;padding:2px 10px;border-radius:99px;background:var(--alert-ink);color:var(--alert-bg);white-space:nowrap}
.turno.ok .badge{background:#14422B;color:#E2F2E9}
.turno p{margin:6px 0 0;font-size:15px}
.turno ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.turno li{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px}
.turno li span{min-width:0}
.turno li strong{display:block;font-weight:900}
.turno .btn{min-height:40px;padding:6px 14px;font-size:15px;background:var(--alert-ink);border-color:var(--alert-ink);color:var(--alert-bg)}
.turno .plazo{font-weight:800}
.turno .link{color:inherit}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .turno.ok{background:#16302A;color:#BDEBD3;border-color:#4C8A70}
  :root:not([data-theme="light"]) .turno.ok .badge{background:#BDEBD3;color:#16302A} }
:root[data-theme="dark"] .turno.ok{background:#16302A;color:#BDEBD3;border-color:#4C8A70}
:root[data-theme="dark"] .turno.ok .badge{background:#BDEBD3;color:#16302A}
.state.late{border-color:var(--bad);color:var(--bad)}
.wk{margin:18px 0 2px;font-size:14px;font-weight:900;color:var(--accent)}
.cumple{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.list.receipt li.urgent{background:var(--alert-bg);border-radius:12px;padding-left:12px;padding-right:12px;margin:4px -12px;border-top-color:transparent}
.list.receipt li.urgent+li{border-top-color:transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom,0px));z-index:9;
  max-width:min(440px,calc(100vw - 32px));background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:12px;font-size:15px;font-weight:700}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
.confirm{border:2px solid var(--bad);border-radius:12px;padding:12px;margin-top:10px;background:var(--paper)}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>

/* ---------- capa de datos: Supabase real ---------- */
function remoteApi(sb, uid){
  const ok = ({data, error}) => { if (error) throw error; return data; };
  let hayOwner = true; // pasa a false si apartments.owner_id todavia no existe
  let hayFoto = true; // pasa a false si la columna profiles.avatar_url todavia no existe
  return {
    kind:'supabase', uid,
    async myName(){ const r = ok(await sb.from('profiles').select('full_name').eq('id', uid).maybeSingle()); return r?.full_name || ''; },
    async setName(name){ ok(await sb.from('profiles').update({full_name:name}).eq('id', uid)); },
    async myAvatar(){
      if (!hayFoto) return '';
      const r = await sb.from('profiles').select('avatar_url').eq('id', uid).maybeSingle();
      if (r.error){ hayFoto = false; return ''; }
      return r.data?.avatar_url || '';
    },
    async setAvatar(url){
      if (!hayFoto) throw new Error('Falta crear la columna avatar_url en la tabla profiles de Supabase.');
      const { error } = await sb.from('profiles').update({avatar_url:url}).eq('id', uid);
      if (error){ hayFoto = false; throw new Error('Falta crear la columna avatar_url en la tabla profiles de Supabase.'); }
    },
    async apartment(){
      const q = c => sb.from('apartment_members').select(`apartment_id, apartments(${c})`).eq('user_id', uid).limit(1);
      let r = await q(hayOwner ? 'id,name,invite_code,owner_id' : 'id,name,invite_code');
      if (r.error && hayOwner){ hayOwner = false; r = await q('id,name,invite_code'); }
      return ok(r)[0]?.apartments || null;
    },
    async apartments(){
      const q = c => sb.from('apartment_members').select(`created_at, apartments(${c})`).eq('user_id', uid).order('created_at');
      let r = await q(hayOwner ? 'id,name,invite_code,owner_id' : 'id,name,invite_code');
      if (r.error && hayOwner){ hayOwner = false; r = await q('id,name,invite_code'); }
      return ok(r).map(x => x.apartments).filter(Boolean);
    },
    async deleteAccount(){
      const { error } = await sb.rpc('delete_my_account');
      if (error){
        if (error.code === 'PGRST202') throw new Error('Falta crear la función delete_my_account en Supabase.');
        throw error;
      }
    },
    async createApartment(name){ ok(await sb.rpc('create_apartment',{p_name:name})); },
    async joinApartment(code){ ok(await sb.rpc('join_apartment',{p_code:code})); },
    async members(aptId){
      const q = cols => sb.from('apartment_members').select(`user_id, created_at, profiles(${cols})`).eq('apartment_id', aptId).order('created_at');
      let r = await q(hayFoto ? 'full_name, avatar_url' : 'full_name');
      if (r.error && hayFoto){ hayFoto = false; r = await q('full_name'); }
      return ok(r).map(x => ({id:x.user_id, name:x.profiles?.full_name || 'Sin nombre', avatar:x.profiles?.avatar_url || ''}));
    },
    async leave(aptId, nuevoAdmin){
      // leave_apartment pasa el admin a otra persona y borra el piso si eres la última; si aún no existe en Supabase, solo se sale
      const r = await sb.rpc('leave_apartment', { p_id: String(aptId), p_new_owner: nuevoAdmin || null });
      if (r.error && r.error.code === 'PGRST202') ok(await sb.from('apartment_members').delete().eq('apartment_id', aptId).eq('user_id', uid));
      else if (r.error) throw r.error;
    },
    async deleteApartment(aptId){
      const { error } = await sb.rpc('delete_apartment', { p_id: String(aptId) });
      if (error){
        if (error.code === 'PGRST202') throw new Error('Falta crear la función delete_apartment en Supabase.');
        throw error;
      }
    },
    async myBalance(aptId){
      const r = ok(await sb.from('apartment_balances').select('balance').eq('apartment_id', aptId).eq('user_id', uid).maybeSingle());
      return Number(r?.balance ?? 0);
    },
    async items(aptId){ return ok(await sb.from('shopping_items').select('id,name,is_bought,created_at').eq('apartment_id', aptId).order('is_bought').order('created_at',{ascending:false})); },
    async addItem(aptId,name){ ok(await sb.from('shopping_items').insert({apartment_id:aptId,name})); },
    async setBought(id,v){ ok(await sb.from('shopping_items').update({is_bought:v}).eq('id', id)); },
    async delItem(id){ ok(await sb.from('shopping_items').delete().eq('id', id)); },
    async renameItem(id,name){ ok(await sb.from('shopping_items').update({name}).eq('id', id)); },
    async zones(aptId){ return ok(await sb.from('cleaning_zones').select('id,name').eq('apartment_id', aptId).order('created_at')); },
    async addZone(aptId,name){ ok(await sb.from('cleaning_zones').insert({apartment_id:aptId,name})); },
    async delZone(id){ ok(await sb.from('cleaning_zones').delete().eq('id', id)); },
    async assignments(aptId, week){
      ok(await sb.rpc('ensure_week_assignments',{p_apartment_id:aptId,p_week_start:week}));
      const rows = ok(await sb.from('cleaning_assignments').select('id,user_id,is_done,done_at,cleaning_zones(name),profiles(full_name)').eq('apartment_id', aptId).eq('week_start', week));
      return rows.map(r => ({id:r.id,user_id:r.user_id,is_done:r.is_done,done_at:r.done_at,zone:r.cleaning_zones?.name || '—',name:r.profiles?.full_name || 'Sin nombre'})).sort((a,b)=>a.zone.localeCompare(b.zone,'es'));
    },
    async history(aptId, fromWeek){
      const rows = ok(await sb.from('cleaning_assignments').select('id,user_id,week_start,is_done,done_at,cleaning_zones(name),profiles(full_name)').eq('apartment_id', aptId).gte('week_start', fromWeek).order('week_start',{ascending:false}).limit(300));
      return rows.map(r => ({id:r.id,user_id:r.user_id,week:r.week_start,is_done:r.is_done,done_at:r.done_at,zone:r.cleaning_zones?.name || '—',name:r.profiles?.full_name || 'Sin nombre'}))
        .sort((a,b)=> b.week.localeCompare(a.week) || a.zone.localeCompare(b.zone,'es'));
    },
    async weekStart(){ return ok(await sb.rpc('current_week_start')); },
    async setDone(id,v){
      const rows = ok(await sb.from('cleaning_assignments').update({is_done:v}).eq('id', id).select('id'));
      if (!rows.length) throw new Error('Solo puedes marcar tus propias tareas.');
    },
    async bills(aptId){ return ok(await sb.from('recurring_bills').select('id,name,amount,frequency,next_due_date,paid_by,is_paused').eq('apartment_id', aptId).eq('is_paused', false).order('next_due_date').order('name')); },
    async addBill(aptId,b){ ok(await sb.from('recurring_bills').insert({apartment_id:aptId,...b})); },
    async billPayments(aptId){ return ok(await sb.from('bill_payments').select('bill_id,user_id,due_date').eq('apartment_id', aptId)); },
    async payShare(aptId,billId,due){ ok(await sb.from('bill_payments').insert({apartment_id:aptId,bill_id:billId,user_id:uid,due_date:due})); },

function demoApi(clave){
  pisoDemo = clave || pisoDemo;
  const P = PISOS[pisoDemo];
  const uid = n => 'u-' + pisoDemo + '-' + n;
  const me = uid(0);
  const db = {
    myName: P.miembros[0],
    apt: { id:'apt-'+pisoDemo, name:P.nombre, invite_code:P.code },
    members: P.miembros.map((n,i) => ({ id:uid(i), name:n })),
    items: P.compra.map(([name,b,dias],i) => ({ id:'i'+i, name, is_bought:!!b, created_at:new Date(Date.now()-(dias||0)*864e5 - i*36e5).toISOString() })),
    zones: P.zonas.map((name,i) => ({ id:'z'+i, name })),
    done: {},
    bills: P.facturas.map(([name,amount,frequency,dias,quien,pausada],i) => ({
      id:'b'+i, name, amount, frequency, next_due_date: iso(new Date(Date.now()+dias*864e5)),
      paid_by: uid(quien), is_paused: !!pausada })),
    pagos: [], n: 100
  };
  // una tarea de la semana ya hecha, para que la demo no salga vacía
  const w = iso(mondayOf());
  if (db.zones.length > 1) db.done['z1'+w] = new Date(Date.now()-864e5).toISOString();
  if (db.bills.length && db.members.length > 1)
    db.pagos.push({ bill_id: db.bills[0].id, user_id: uid(1), due_date: db.bills[0].next_due_date });
  const id = p => p + (db.n++);
  const wait = v => new Promise(r => setTimeout(()=>r(v), 110));
  return {
    kind:'demo', uid:me, piso:pisoDemo,
    myName:()=>wait(db.myName), setName:n=>{ db.myName=n; db.members[0].name=n; return wait(); },
    apartment:()=>wait(db.apt), apartments:()=>wait(db.apt ? [db.apt] : []), createApartment:n=>{ db.apt={id:'apt-nuevo',name:n,invite_code:'M4R7TA'}; return wait(); },
    joinApartment:c=>{ const ok = Object.values(PISOS).some(p => p.code === c.toUpperCase()) || c.toUpperCase()===(db.apt?.invite_code||''); return ok ? wait() : Promise.reject(new Error('Código de piso no válido')); },
    members:()=>wait(db.members.slice()), leave:()=>{ db.apt=null; return wait(); }, deleteApartment:()=>{ db.apt=null; return wait(); },
    myBalance:()=>wait(P.saldo),
    items:()=>wait(db.items.slice().sort((a,b)=>a.is_bought-b.is_bought || b.created_at.localeCompare(a.created_at))),
    addItem:(a,name)=>{ if (db.items.some(i=>i.name.toLowerCase()===name.toLowerCase())) return Promise.reject({code:'23505',message:'dup'}); db.items.push({id:id('i'),name,is_bought:false,created_at:new Date().toISOString()}); return wait(); },
    setBought:(i,v)=>{ db.items.find(x=>x.id===i).is_bought=v; return wait(); },
    delItem:i=>{ db.items=db.items.filter(x=>x.id!==i); return wait(); },
    renameItem:(i,name)=>{ if (db.items.some(x=>x.id!==i && x.name.toLowerCase()===name.toLowerCase())) return Promise.reject({code:'23505',message:'dup'}); db.items.find(x=>x.id===i).name=name; return wait(); },
    zones:()=>wait(db.zones.slice()),
    addZone:(a,name)=>{ if (db.zones.some(z=>z.name.toLowerCase()===name.toLowerCase())) return Promise.reject({code:'23505',message:'dup'}); db.zones.push({id:id('z'),name}); return wait(); },
    delZone:i=>{ db.zones=db.zones.filter(x=>x.id!==i); return wait(); },
    assignments:(a,week)=>{
      if (db.members.length < 2) return wait([]);
      const wk = Math.floor((new Date(week+'T00:00:00') - new Date('2000-01-03T00:00:00'))/(7*864e5));
      return wait(db.zones.map((z,i)=>{ const m = db.members[(i+wk)%db.members.length]; const k = z.id+week;
        return {id:k,user_id:m.id,is_done:!!db.done[k],done_at:db.done[k]||null,zone:z.name,name:m.name}; }));
    },
    weekStart:()=>wait(iso(mondayOf())),
    history:(a,fromWeek)=>{
      const out = []; const base = mondayOf();
      for (let k=0;k<6;k++){
        const ws = new Date(base); ws.setDate(ws.getDate()-7*k); const week = iso(ws);
        if (week < fromWeek) break;
        const wk = Math.floor((new Date(week+'T00:00:00') - new Date('2000-01-03T00:00:00'))/(7*864e5));
        db.zones.forEach((z,i)=>{ const m = db.members[(i+wk)%db.members.length]; const key = z.id+week;
          let done_at = db.done[key] || null;
          if (k>0 && !(key in db.done) && (i*7+k*3)%5!==0){ const d = new Date(ws); d.setDate(d.getDate()+((i+k)%5)+1); d.setHours(9+((i*3+k)%11),(i*17)%60,0,0); done_at = d.toISOString(); }
          out.push({id:key,user_id:m.id,week,is_done:!!done_at,done_at,zone:z.name,name:m.name}); });
      }
      return wait(out.sort((a,b)=> b.week.localeCompare(a.week) || a.zone.localeCompare(b.zone,'es')));
    },
    setDone:(i,v)=>{ db.done[i]= v ? new Date().toISOString() : null; return wait(); },
    bills:()=>wait(db.bills.filter(b=>!b.is_paused).sort((a,b)=>a.next_due_date.localeCompare(b.next_due_date)||a.name.localeCompare(b.name,'es'))),
    addBill:(a,b)=>{ db.bills.push({id:id('b'),is_paused:false,...b}); return wait(); },
    billPayments:()=>wait(db.pagos.slice()),
    payShare:(a,billId,due)=>{ db.pagos.push({bill_id:billId,user_id:me,due_date:due}); return wait(); },
    unpayShare:(billId,due)=>{ db.pagos = db.pagos.filter(p=>!(p.bill_id===billId && p.due_date===due && p.user_id===me)); return wait(); },
    advanceBill:(billId)=>{ const b = db.bills.find(x=>x.id===billId); const d = new Date(b.next_due_date+'T00:00:00');
      const saltos={weekly:()=>d.setDate(d.getDate()+7),monthly:()=>d.setMonth(d.getMonth()+1),bimonthly:()=>d.setMonth(d.getMonth()+2),quarterly:()=>d.setMonth(d.getMonth()+3),yearly:()=>d.setFullYear(d.getFullYear()+1)};
      (saltos[b.frequency]||saltos.monthly)(); b.next_due_date = iso(d); return wait(); }
  };
}

const limite = (promesa, ms, msg) => Promise.race([
  Promise.resolve(promesa),
  new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))
]);

async function boot(forceDemo){
  app.innerHTML = '<div class="loading">Conectando con la base de datos…</div>';
  $('#nav').hidden = true;
  if (forceDemo){ S.api = demoApi(); return start(); }
  try{
    if (!window.supabase) throw new Error('No se pudo cargar la librería de Supabase. Comprueba tu conexión a internet.');
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { storage: safeStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    // Si la cuenta de Google ya existía, Supabase no puede enlazarla al usuario anónimo y vuelve con un error: entramos con ella.
    const q = new URLSearchParams(location.hash.replace(/^#/, '') + '&' + location.search.slice(1));
    if (/identity_already_exists|already linked/i.test((q.get('error_code') || '') + ' ' + (q.get('error_description') || ''))){
      history.replaceState(null, '', location.pathname);
      const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + location.pathname } });
      if (error) throw error;
      return;
    }
    let session = null;
    try{ session = (await limite(sb.auth.getSession(), 4000, 'tiempo'))?.data?.session || null; }catch{ session = null; }
    if (!session){
      const { data, error } = await limite(sb.auth.signInAnonymously(), 9000,
        'La base de datos no responde desde aquí.');
      if (error) throw error;
      session = data.session;
    }
    // Al enlazar Google, nombre y foto solo viven en las identidades del usuario, no en user_metadata.
    let user = session.user;
    try{ const r = await limite(sb.auth.getUser(), 4000, 'tiempo'); if (r?.data?.user) user = r.data.user; }catch{}
    const gId = (user.identities || []).find(i => i.provider === 'google')?.identity_data || {};
    const meta = user.user_metadata || {};
    S.sb = sb; S.anon = !!user.is_anonymous; S.email = user.email || gId.email || '';
    S.avatar = gId.avatar_url || gId.picture || meta.avatar_url || meta.picture || '';
    S.nombreG = gId.full_name || gId.name || meta.full_name || meta.name || S.email;
    S.api = remoteApi(sb, session.user.id);
    await limite(S.api.myName(), 9000, 'La base de datos no responde desde aquí.');
    return start();
  }catch(e){ showConnectionError(e); }
}

function showConnectionError(e){
  const m = (e && e.message) || String(e);
  const anon = /anonymous/i.test(m);
  const suelto = location.protocol === 'file:' || location.protocol === 'blob:';
  app.innerHTML = `
    <header class="top"><div class="meta">${LOGO_IMG}</div><h1>No he podido conectar</h1></header>
    <div class="notice"><b>${esc(m)}</b>
      ${anon ? `<ol><li>Abre el panel de Supabase y entra en el proyecto <b>TodoenOrden</b>.</li><li>Ve a <b>Authentication → Sign In / Providers</b>.</li><li>Activa <b>Allow anonymous sign-ins</b> y guarda.</li><li>Vuelve aquí y pulsa Reintentar.</li></ol>`
        : suelto ? `<p style="margin:8px 0 0">Has abierto el archivo guardado en el móvil. Desde ahí el navegador bloquea la conexión con la base de datos. Publica la app y ábrela por su enlace (https://…), o mírala aquí mismo con datos de ejemplo.</p>`
        : '<p style="margin:8px 0 0">Comprueba tu conexión a internet y vuelve a intentarlo.</p>'}
    </div>
    <div class="stack">
      <button class="btn" id="retry">Reintentar</button>
      <button class="btn ghost" id="demo">Ver con datos de ejemplo (sin base de datos)</button>
    </div>`;
  $('#retry').onclick = () => boot(false);
  $('#demo').onclick = () => boot(true);
}

  </section>`;

function reducirFoto(file, lado = 160){
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = lado;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, lado, lado);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('No he podido leer esa imagen.')); };
    img.src = url;
  });
}
function bindEditorPerfil(rerender){
  const recargar = async () => { if (S.apt) S.members = await S.api.members(S.apt.id); };
  $('#fName').onsubmit = e => run(e, async () => {
    const n = $('#newName').value.trim(); if (!n) return;
    await S.api.setName(n); S.me = n; await recargar(); toast('Nombre actualizado.'); rerender();
  });
  const f = $('#fotoFile'); if (!f) return;
  const guardar = async url => {
    try{ await S.api.setAvatar(url); S.myAvatar = url; await recargar(); toast('Foto actualizada.'); rerender(); }
    catch(err){ toast(friendly(err)); }
  };
  $('#fotoBtn').onclick = () => f.click();
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    try{ await guardar(await reducirFoto(file)); }catch(err){ toast(friendly(err)); }
  };
}

        <button class="btn" type="submit">Añadir</button>
      </form>
      ${pend.length ? dias.map(d => bloque(d.et, d.items)).join('')
        : '<p class="empty">Nada pendiente. La nevera está a salvo.</p>'}
      ${comprados.length ? bloque('Ya comprado', comprados) : ''}
    </section>`;

  $('#fItem').onsubmit = e => run(e, async () => { await S.api.addItem(S.apt.id, $('#itemName').value.trim()); await renderCompra(); });
  app.querySelectorAll('[data-b]').forEach(b => b.onclick = async () => {
    try{ await S.api.setBought(b.dataset.b, b.getAttribute('aria-pressed') !== 'true'); await renderCompra(); }catch(err){ toast(friendly(err)); }
  });
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
    try{ await S.api.delItem(b.dataset.d); await renderCompra(); }catch(err){ toast(friendly(err)); }
  });
  app.querySelectorAll('[data-e]').forEach(b => b.onclick = async () => {
    S.editItem = b.dataset.e; await renderCompra(); const inp = $('#editName'); if (inp){ inp.focus(); inp.select(); }
  });
  const fe = app.querySelector('form[data-edit]');
  if (fe){
    fe.onsubmit = e => run(e, async () => { await S.api.renameItem(fe.dataset.edit, $('#editName').value.trim()); S.editItem = null; toast('Producto actualizado.'); await renderCompra(); });
    $('#cancelEdit').onclick = async () => { S.editItem = null; await renderCompra(); };
  }
}

/* Limpieza: recordatorio del turno e histórico */
// La semana actual la decide el servidor (hora de Madrid), no el reloj del móvil
const curMonday = () => new Date(S.mon || mondayOf());
async function loadWeek(){
  try{ S.mon = new Date((await S.api.weekStart()) + 'T00:00:00'); if (isNaN(S.mon)) S.mon = null; }catch{ S.mon = null; }
}
const SOLO_UNO = 'Hacen falta al menos 2 compañeros para rotar los turnos. Cuando se una alguien, la rotación empezará sola.';
function fmtDoneAt(when){
  const d = new Date(when); if (isNaN(d)) return '';
  return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}) + ', ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}
function weekRange(mon){
  const end = new Date(mon); end.setDate(end.getDate()+6);
  return `${mon.toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}`;
}
function plazoWords(){
  const end = new Date(curMonday()); end.setDate(end.getDate()+6);
  const f = end.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}).replace(',','');
  const n = daysUntil(iso(end));
  if (n <= 0) return `Plazo: hoy, ${f}. Es el último día.`;
  return `Plazo: ${f}. ${n===1?'Queda 1 día':'Quedan '+n+' días'}.`;
}
function turnoHtml(asg){
  if (!asg) return '';
  const range = weekRange(curMonday());
  if (S.members.length < 2) return `<section class="turno vacio" aria-live="polite"><div class="turno-top"><b>Tu turno de limpieza</b></div><p>${esc(SOLO_UNO)}</p></section>`;
  if (!asg.length) return `<section class="turno vacio" aria-live="polite"><div class="turno-top"><b>Tu turno de limpieza</b></div>
    <p>Todavía no hay rotación esta semana. Define las zonas del piso y se generará sola.</p><button class="link" data-go="limpieza">Ir a Limpieza</button></section>`;
  const mine = asg.filter(a => a.user_id === S.api.uid);
  if (!mine.length) return `<section class="turno vacio" aria-live="polite"><div class="turno-top"><b>Esta semana no tienes turno</b></div>
    <p>No se te ha asignado ninguna zona (semana del ${esc(range)}). No tienes que hacer nada.</p></section>`;
  const hechas = mine.filter(a => a.is_done).length, todo = hechas === mine.length;
  return `<section class="turno ${todo?'ok':''}" aria-live="polite">
    <div class="turno-top"><b>Tu turno de limpieza</b><span class="badge">${todo?'Completada':(mine.length>1?hechas+' de '+mine.length+' hechas':'Pendiente')}</span></div>
    <p>${esc(S.me || 'Tú')} · semana del ${esc(range)}</p>
    <ul>${mine.map(a => `<li><span><strong>${esc(a.zone)}</strong>${a.is_done ? '✔ Completada el ' + esc(fmtDoneAt(a.done_at)) : 'Pendiente'}</span>
      ${a.is_done ? '' : `<button class="btn small" data-turno="${a.id}">Hecha</button>`}</li>`).join('')}</ul>
    ${todo ? '' : `<p class="plazo">${esc(plazoWords())}</p>`}</section>`;
}

/* Limpieza: zonas y marcar hecha (TEO-16, TEO-15) */
function doneLabel(when){
  if (!when) return 'Hecha';
  const d = new Date(when);
  if (isNaN(d)) return 'Hecha';
  return 'Hecha el ' + d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'});
}
function historicoHtml(hist, currentWeek){
  if (hist === null) return `<section class="sec"><h2>Histórico de limpieza</h2><p class="sub">No se ha podido cargar el histórico. Prueba a actualizar.</p><button class="btn ghost small" id="histRefresh">Actualizar</button></section>`;
  if (!hist.length) return `<section class="sec"><div class="sec-head"><h2>Histórico de limpieza</h2><button class="link" id="histRefresh">Actualizar</button></div>
    <p class="sub">Aún no hay turnos registrados. Cuando pase la primera semana verás aquí quién ha cumplido.</p></section>`;
  const weeks = []; hist.forEach(h => { let w = weeks.find(x => x.week === h.week); if (!w){ w = {week:h.week, rows:[]}; weeks.push(w); } w.rows.push(h); });
  const cumple = new Map();
  hist.filter(h => h.week < currentWeek).forEach(h => { const c = cumple.get(h.user_id) || {name:h.name,hechas:0,total:0}; c.total++; if (h.is_done) c.hechas++; cumple.set(h.user_id, c); });
  const chips = [...cumple.entries()].map(([id,c]) => `<span class="chip mag ${mc(id)}">${fotoChip(id)}${esc(c.name)}: ${c.hechas} de ${c.total} (${Math.round(100*c.hechas/c.total)} %)</span>`).join('');
  return `<section class="sec" id="hist">
    <div class="sec-head"><h2>Histórico de limpieza</h2><button class="link" id="histRefresh">Actualizar</button></div>
    <p class="sub">Los turnos de todos los compañeros, de la semana más reciente a la más antigua.</p>
    ${chips ? `<p class="sub" style="margin:0 0 4px">Cumplimiento de las semanas ya cerradas:</p><div class="cumple">${chips}</div>` : ''}
    ${weeks.map(w => { const mon = new Date(w.week+'T00:00:00'); const cur = w.week === currentWeek; const past = w.week < currentWeek;
      return `<h3 class="wk">${cur ? 'Esta semana' : 'Semana del'} ${esc(weekRange(mon))}</h3>
      <ul class="list">${w.rows.map(h => `<li><span class="grow"><span class="name">${esc(h.zone)}</span>
        <span class="meta-line"><span class="chip mag persona ${mc(h.user_id)}">${fotoChip(h.user_id, 1)}${quienChip(h.user_id, h.name)}</span>
        ${h.is_done ? `<span class="state ok">✔ Completada · ${esc(fmtDoneAt(h.done_at))}</span>` : `<span class="state ${past?'late':''}">${past?'No hecha':'Pendiente'}</span>`}</span></span></li>`).join('')}</ul>`; }).join('')}
  </section>`;
}
async function renderLimpieza(){
  const [, mem] = await Promise.all([loadWeek(), S.api.members(S.apt.id).catch(() => null)]);
  if (mem) S.members = mem;
  const week = iso(curMonday());
  const [zones, asg] = await Promise.all([S.api.zones(S.apt.id), S.api.assignments(S.apt.id, week)]);
  const descansan = asg.length ? S.members.filter(m => !asg.some(a => a.user_id === m.id)).map(m => m.id === S.api.uid ? 'tú' : m.name) : [];
  const from = curMonday(); from.setDate(from.getDate()-7*7);
  let hist = [];
  try{ hist = await S.api.history(S.apt.id, iso(from)); }catch{ hist = null; }
  const done = asg.filter(a => a.is_done).length;
  const end = new Date(curMonday()); end.setDate(end.getDate()+6);
  const range = `${curMonday().toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}`;
  app.innerHTML = `${header('Limpieza')}
    <section class="sec">
      <div class="sec-head"><h2>Esta semana</h2><span class="count">${done} de ${asg.length} hechas</span></div>
      <p class="sub">Semana del ${esc(range)}. Cada lunes las zonas pasan al compañero anterior de la lista y nadie repite la zona de la semana pasada. El reparto se genera la primera vez que alguien abre la app esa semana.</p>
      ${descansan.length ? `<p class="sub" style="margin-top:-4px">Sin zona esta semana: <b>${esc(descansan.join(', '))}</b>. El descanso también va rotando.</p>` : ''}
      ${asg.length ? `<div class="seg" aria-hidden="true">${asg.map(a => `<i class="${a.is_done?'on '+mc(a.user_id):''}"></i>`).join('')}</div>` : ''}
      <ul class="list">${asg.length ? asg.map(a => { const mine = a.user_id === S.api.uid; return `
        <li><button class="check" aria-pressed="${a.is_done}" data-a="${a.id}" ${mine?'':'disabled'} aria-label="${esc(a.zone)}: ${a.is_done?'hecha':'pendiente'}">${CHECK}</button>
          <span class="grow"><span class="name ${a.is_done?'done':''}">${esc(a.zone)}</span>
            <span class="meta-line"><span class="chip mag persona ${mc(a.user_id)}">${fotoChip(a.user_id, 1)}${quienChip(a.user_id, a.name)}</span>
              <span class="state ${a.is_done?'ok':''}">${a.is_done ? esc(doneLabel(a.done_at)) : 'Pendiente'}</span></span></span></li>`; }).join('')
        : `<li class="empty">${S.members.length < 2 ? esc(SOLO_UNO) : (zones.length ? 'Todavía no hay reparto esta semana. Recarga la página.' : 'Define las zonas de la casa y aquí aparecerá quién limpia cada una.')}</li>`}</ul>
    </section>
    <section class="sec">
      <h2>Zonas de limpieza</h2>
      <p class="sub">Las zonas que hay que mantener limpias.</p>
      <form class="row" id="fZone"><input id="zoneName" maxlength="40" placeholder="Baño, cocina, salón…" aria-label="Nueva zona" required><button class="btn" type="submit">Añadir</button></form>
      <ul class="list" style="margin-top:6px">${zones.map(z => `
        <li><span class="grow name">${esc(z.name)}</span><button class="x" data-z="${z.id}" aria-label="Quitar ${esc(z.name)}">${CROSS}</button></li>`).join('')}</ul>
    </section>
    ${historicoHtml(hist, week)}`;
  const hr = $('#histRefresh'); if (hr) hr.onclick = async () => { hr.disabled = true; try{ await renderLimpieza(); toast('Histórico actualizado.'); }catch(err){ toast(friendly(err)); } };
  $('#fZone').onsubmit = e => run(e, async () => { await S.api.addZone(S.apt.id, $('#zoneName').value.trim()); await renderLimpieza(); });
  app.querySelectorAll('[data-z]').forEach(b => b.onclick = async () => {
    try{ await S.api.delZone(b.dataset.z); await renderLimpieza(); }catch(err){ toast(friendly(err)); }
  });
  app.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    try{ await S.api.setDone(b.dataset.a, b.getAttribute('aria-pressed') !== 'true'); await renderLimpieza(); }catch(err){ toast(friendly(err)); }
  });
}

/* Cómo funciona la app */
const PASOS = [
  ['1','Crea tu piso o únete','Quien monta el piso recibe un código de 6 letras. Los demás lo escriben una vez y ya están dentro. Todos veis lo mismo al instante.'],
  ['2','Apuntad la compra','Cualquiera añade lo que falta en casa. Quien va al súper lo va tachando, y al lado queda su nombre para que se sepa quién ha ido.'],
  ['3','Repartid la limpieza','Definís las zonas una vez y la app reparte los turnos cada semana, rotando para que no le toque siempre lo mismo a la misma persona. Cada uno marca su tarea cuando la hace. Al abrir la app, una tarjeta te recuerda tu turno y el plazo, y en Limpieza tienes el histórico de quién ha cumplido.'],
  ['4','Controlad las facturas','Dad de alta la luz, el agua o el internet con su importe y cada cuánto se repiten. La app os avisa de los vencimientos, divide el importe entre los del piso y cada uno marca cuando ha pagado su parte.'],
  ['5','Compartid el enlace','La app se abre desde el navegador del móvil, sin instalar nada. Pásale el enlace a tus compañeros.']
];
function renderAyuda(){
  app.innerHTML = `${header('Cómo funciona')}
    <section class="sec">
      <h2>TodoenOrden en cinco pasos</h2>
      <p class="sub">La app para que un piso compartido no acabe a mensajes por el grupo.</p>
      <ul class="list">${PASOS.map(([n,t,d]) => `
        <li><span class="mag-dot mag m${n}">${n}</span>
          <span class="grow"><span class="name">${esc(t)}</span><br><span class="small dim">${esc(d)}</span></span></li>`).join('')}</ul>
    </section>
    <section class="sec">
      <h2>Lo que conviene saber</h2>
      <ul class="list">
        <li><span class="grow"><span class="name">Tu sitio vive en este navegador</span><br><span class="small dim">No hay usuario ni contraseña. Si borras los datos del navegador o cambias de móvil, tendrás que volver a entrar con el código del piso.</span></span></li>
        <li><span class="grow"><span class="name">Todo es compartido</span><br><span class="small dim">Lo que añade uno lo ven los demás. Nadie de fuera del piso puede ver vuestros datos.</span></span></li>
        <li><span class="grow"><span class="name">Solo tú marcas lo tuyo</span><br><span class="small dim">Tus turnos de limpieza y tu parte de cada factura solo los puedes marcar tú.</span></span></li>
      </ul>
      <button class="btn" data-go="piso" style="margin-top:14px;width:100%">Entendido, volver al piso</button>
    </section>`;
}

/* Facturas periódicas: alta, reparto entre compañeros y pago de tu parte (TEO-34, TEO-31) */
function dayLabel(when){
  if (!when) return 'Sin fecha';
  const d = new Date(when); if (isNaN(d)) return 'Sin fecha';
  const hoy = new Date(); const dia = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const dif = Math.round((dia(hoy) - dia(d)) / 864e5);
  if (dif <= 0) return 'Hoy';
  if (dif === 1) return 'Ayer';
  if (dif < 7) return d.toLocaleDateString('es-ES',{weekday:'long'});
  return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
}
const REPITE = {weekly:'cada semana',monthly:'cada mes',bimonthly:'cada 2 meses',quarterly:'cada 3 meses',yearly:'cada año'};
async function renderFacturas(){
  const [bills, pagos] = await Promise.all([S.api.bills(S.apt.id), S.api.billPayments(S.apt.id).catch(()=>[])]);
  S.bills = bills;
  const who = id => S.members.find(m => m.id === id)?.name || 'Alguien';
  const n = Math.max(S.members.length, 1);
  app.innerHTML = `${header('Facturas')}
    <section class="sec">
      <div class="sec-head"><h2>Próximos vencimientos</h2><span class="count">${bills.length}</span></div>
      <p class="sub">Se repiten solas. El importe se divide entre los ${n === 1 ? 'del piso' : n + ' compañeros'} y cada uno marca su parte.</p>
      <ul class="list receipt">${bills.length ? bills.map(b => {
        const d = daysUntil(b.next_due_date);
        const urgent = d < 3;
        const label = d < 0 ? `Vencida hace ${-d} d` : d === 0 ? 'Vence hoy' : d === 1 ? 'Vence mañana' : d === 2 ? 'Vence en 2 días' : `En ${d} d`;
        const due = d < 0 ? `<span class="due late">${label}</span>` : urgent ? `<span class="due soon">${label}</span>` : `<span class="due dim">${label}</span>`;
        const parte = Number(b.amount) / n;
        const hechos = pagos.filter(p => p.bill_id === b.id && p.due_date === b.next_due_date);
        const yoPago = hechos.some(p => p.user_id === S.api.uid);
        const todos = hechos.length >= n;
        return `<li class="${urgent && !todos ? 'urgent' : ''}"><span class="grow">
            <span class="name">${esc(b.name)}</span><br>
            <span class="small dim">${esc(fmtDate(b.next_due_date))} · se repite ${esc(REPITE[b.frequency] || 'cada mes')} · la adelanta ${esc(who(b.paid_by))}</span>
            <span class="meta-line">${S.members.map(m => {
              const ok = hechos.some(p => p.user_id === m.id);
              return `<span class="state ${ok?'ok':''}" title="${ok?'ha pagado su parte':'le falta pagar'}">${esc(m.name)}${ok?' ✓':''}</span>`;
            }).join('')}</span>
            <span class="meta-line">
              <button class="btn small ${yoPago?'ghost':''}" data-pay="${b.id}" data-due="${b.next_due_date}" data-on="${yoPago}">${yoPago ? 'Ya he pagado mi parte ✓' : `Pagar mi parte (${eur(parte)})`}</button>
              ${todos ? `<button class="btn small ghost" data-next="${b.id}">Pasar al siguiente vencimiento</button>` : ''}
            </span>
            ${todos ? '<span class="meta-line"><span class="state ok">Pagada entre todos</span></span>' : ''}
          </span>
          <span class="right"><span class="amount">${eur(b.amount)}</span><span class="small dim">tu parte ${eur(parte)}</span>${due}</span></li>`; }).join('')
        : '<li class="empty">Todavía no hay facturas. Da de alta la luz, el agua o el internet y se repetirán solas.</li>'}</ul>
    </section>
    <section class="sec">
      <h2>Nueva factura periódica</h2>
      <p class="sub">Se guarda una vez y vuelve sola en cada vencimiento.</p>
      <form class="panel" id="fBill" novalidate>
        <label>Nombre<input id="bName" maxlength="60" placeholder="Luz"><small class="err" id="eName" role="alert" hidden></small></label>
        <div class="row">
          <label>Importe (€)<input id="bAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="72,40"><small class="err" id="eAmount" role="alert" hidden></small></label>
          <label>Se repite<select id="bFreq">${Object.entries(FREQ).map(([k,v]) => `<option value="${k}" ${k==='monthly'?'selected':''}>${v}</option>`).join('')}</select></label>
        </div>
        <div class="row">
          <label>Fecha de vencimiento<input id="bDate" type="date"><small class="err" id="eDate" role="alert" hidden></small></label>
          <label>La adelanta<select id="bPaid">${S.members.map(m => `<option value="${m.id}" ${m.id===S.api.uid?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
        </div>
        <button class="btn" type="submit">Dar de alta</button>
      </form>
    </section>`;

  app.querySelectorAll('[data-pay]').forEach(btn => btn.onclick = async () => {
    try{
      if (btn.dataset.on === 'true') await S.api.unpayShare(btn.dataset.pay, btn.dataset.due);
      else { await S.api.payShare(S.apt.id, btn.dataset.pay, btn.dataset.due); toast('Tu parte queda marcada como pagada.'); }
      await renderFacturas();
    }catch(err){ toast(friendly(err)); }
  });
  app.querySelectorAll('[data-next]').forEach(btn => btn.onclick = async () => {
    try{ await S.api.advanceBill(btn.dataset.next); toast('Factura pasada al siguiente vencimiento.'); await renderFacturas(); }
    catch(err){ toast(friendly(err)); }
  });

  ['bName','bAmount','bDate'].forEach(id => $('#'+id).addEventListener('input', () => clearFieldError(id)));
  $('#fBill').onsubmit = e => run(e, async () => {
    ['bName','bAmount','bDate'].forEach(clearFieldError);
    let first = null;
    const fail = (id, msg) => { const el = $('#'+id), er = $('#e'+id.slice(1)); er.textContent = msg; er.hidden = false; el.classList.add('invalid'); el.setAttribute('aria-invalid','true'); first = first || el; };
    const name = $('#bName').value.trim();
    const amount = Number($('#bAmount').value);
    const date = $('#bDate').value;
    if (!name) fail('bName', 'Escribe el nombre de la factura.');
    if (!(amount > 0)) fail('bAmount', 'Indica un importe mayor que 0.');
    if (!date) fail('bDate', 'Indica la fecha de vencimiento.');
    if (first){ first.focus(); return; }
    await S.api.addBill(S.apt.id, {name, amount, frequency:$('#bFreq').value, next_due_date:date, paid_by:$('#bPaid').value});
    toast('Factura dada de alta.'); await renderFacturas();
  });
}

boot(new URLSearchParams(location.search).has('demo'));
